name: Données objectives (DVF + OpenStreetMap)

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 2 1,4,7,10 *"   # tous les trois mois

permissions:
  contents: write

concurrency:
  group: donnees
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache-donnees
          key: donnees-${{ github.run_id }}
          restore-keys: donnees-
      - name: Préparer les tuiles
        run: |
          set -o pipefail
          python -u scripts/donnees/build.py data 2>&1 | tee build.log
      - name: Résumé
        if: always()
        run: |
          if [ -f build.log ]; then
            msg=$(tail -n 40 build.log | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::notice title=Journal::${msg}"
          fi
      - name: Publier
        run: |
          git config user.name "heden-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Données : mise à jour DVF et OpenStreetMap"
          git pull --rebase origin main
          git push origin HEAD:main
