name: Site (construction et mise en ligne)

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Données objectives (DVF + OpenStreetMap)", "Loyers (encadrement Paris + carte des loyers)", "Lieux connus (OpenStreetMap)", "Espaces verts (OpenStreetMap)"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Essais (un échec bloque la mise en ligne)
        run: |
          pip install -q playwright==1.56.0
          python -m playwright install --with-deps chromium
          python tests/essais.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
