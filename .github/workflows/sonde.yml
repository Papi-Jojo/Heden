name: Sonde API (temporaire)
on: {push: {branches: [sonde]}}
permissions: {contents: write}
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p sonde; cd sonde; rm -f *
          curl -s "https://data.ademe.fr/data-fair/api/v1/datasets/meg-83tjwtg8dyz4vv7h1dqe/lines?size=30&select=numero_dpe,adresse_ban,nom_rue_ban,etiquette_dpe,surface_habitable_logement,conso_5_usages_par_m2_ep,date_etablissement_dpe,numero_etage_appartement,annee_construction,_geopoint&sort=-date_etablissement_dpe&qs=code_postal_ban%3A75011%20AND%20surface_habitable_logement%3A%5B66.0%20TO%2070.0%5D%20AND%20conso_5_usages_par_m2_ep%3A%5B186%20TO%20188%5D" -o k.json; curl -s "https://data.ademe.fr/data-fair/api/v1/datasets/meg-83tjwtg8dyz4vv7h1dqe/lines?size=30&select=numero_dpe,adresse_ban,nom_rue_ban,etiquette_dpe,surface_habitable_logement,conso_5_usages_par_m2_ep,date_etablissement_dpe,numero_etage_appartement,annee_construction,_geopoint&sort=-date_etablissement_dpe&qs=code_postal_ban%3A75011%20AND%20surface_habitable_logement%3A%5B66.0%20TO%2070.0%5D&q=oberkampf&q_fields=nom_rue_ban" -o r.json; curl -s "https://data.geopf.fr/geocodage/search/?q=rue%20du%20Faubourg%20Saint-Antoine&postcode=75012&limit=1" -o g.json
          ls -la
      - run: |
          git config user.name sonde; git config user.email sonde@example.com
          git add sonde; git commit -qm "sonde"; git push origin HEAD:sonde
