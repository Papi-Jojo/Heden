/* Zone en cours de tracé : sommets, poignées de milieu, aperçu rempli */
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const draftColor = () => base === "sat" ? "#F8F5F0" : "#1F3A6E";
let draftShape = null, selVertex = null;
function clearDraftLayers() { clearGhost(); if (draftLayers) { draftLayers.forEach(l => map.removeLayer(l)); draftLayers = null; draftShape = null; } }
function handleIcon(cls, size) { return L.divIcon({className: "handle " + cls, iconSize: [size, size]}); }
function drawDraft() {
  clearDraftLayers();
  if (!draft) return;
  const pts = draft.points, c = draftColor(), editing = ui.mode === "placing", layers = [];
  if (pts.length >= 2) {
    const style = {color: c, weight: editing ? 2.5 : 3, dashArray: editing ? "7 6" : null, interactive: false};
    draftShape = (pts.length >= 3 || !editing) ? L.polygon(pts, Object.assign({fillColor: c, fillOpacity: editing ? .2 : .24}, style)) : L.polyline(pts, style);
    layers.push(draftShape.addTo(map));
  }
  if (editing && draft.closed) {
    pts.forEach((p, i) => {
      const q = pts[(i + 1) % pts.length];
      const m = L.marker([(p[0] + q[0]) / 2, (p[1] + q[1]) / 2], {draggable: true, keyboard: false, icon: handleIcon("handle--mid", 14), title: "Tirer pour ajouter un point"}).addTo(map);
      let idx = null;
      m.on("dragstart", () => { idx = i + 1; const ll = m.getLatLng(); draft.points.splice(idx, 0, [ll.lat, ll.lng]); });
      m.on("drag", () => { const ll = m.getLatLng(); draft.points[idx] = [ll.lat, ll.lng]; draftShape && draftShape.setLatLngs(draft.points); });
      m.on("dragend", () => { selVertex = idx; drawDraft(); renderPanel(); });
      m.on("click", () => { const ll = m.getLatLng(); draft.points.splice(i + 1, 0, [ll.lat, ll.lng]); selVertex = i + 1; drawDraft(); renderPanel(); });
      layers.push(m);
    });
  }
  if (editing) {
    pts.forEach((p, i) => {
      const first = i === 0 && !draft.closed && pts.length >= 3;
      const v = L.marker(p, {draggable: true, keyboard: false, title: first ? "Fermer la zone" : "Déplacer ce point",
        icon: handleIcon("handle--vertex" + (first ? " handle--first" : "") + (selVertex === i ? " handle--sel" : ""), first ? 24 : 20)}).addTo(map);
      v.on("drag", () => { const ll = v.getLatLng(); draft.points[i] = [ll.lat, ll.lng]; draftShape && draftShape.setLatLngs(draft.points); });
      v.on("dragend", () => { selVertex = i; drawDraft(); renderPanel(); });

let ghost = null;

map.on("mouseout", clearGhost);

}

   Feuille mobile glissante : on la tire vers le bas pour voir la carte,
   on la remonte (ou on touche son titre) pour la rouvrir.
   ========================================================= */
let sheetDrag = null, suppressClick = false;
function peekHeight() { const h = panel.querySelector(".panel__head"); return h ? h.offsetTop + h.offsetHeight : 76; }
function sheetMax() { return Math.max(0, panel.offsetHeight - peekHeight()); }
function sheetOffset() { return ui.sheet === "peek" ? sheetMax() : 0; }
function setSheetVar(off) {
  const visible = isDesktop() ? 0 : panel.offsetHeight - off;

}
function applySheet() {
  if (isDesktop()) { panel.style.transform = ""; panel.removeAttribute("data-sheet"); setSheetVar(0); return; }

}

});

  }
  d.off = Math.min(d.max, Math.max(0, d.off0 + dy));

  setSheetVar(d.off);
}, {passive: true});

function paintLivePrice() {

  if (isRent()) {

    : p ? `<span class="label">Prix des ventes ici</span><b class="num">${fmtInt(p.med)}&#8239;€/m²</b><span class="conf ${CONF[p.conf][1]}">${CONF[p.conf][0]}</span>`

/* Annuler une zone (tracé ou notation) : on demande confirmation dès qu'il y a quelque chose à perdre */
async function confirmCancelDraft() {
  if (!draft) return;
  const orig = draft.id && state.zones.find(x => x.id === draft.id);
  const pick = z => JSON.stringify([z.points, z.ratings || {}, z.comment || "", z.name || "", !!z.fav, z.price || null, z.moment || "", z.date || ""]);
  const lose = orig ? pick(orig) !== pick(draft) : draft.points.length > 0;
  if (lose && !(await askConfirm(orig
    ? {title: "Annuler vos modifications ?", text: "Le tracé, les notes et les commentaires modifiés ne seront pas enregistrés. La zone reste comme avant.", ok: "Annuler les modifications", cancel: "Continuer", abandon: true}
    : draft.walk
      ? {title: "Abandonner la zone de votre balade ?", text: draft.pendingPhotos && draft.pendingPhotos.length ? "La zone proposée, le parcours et les photos de la balade seront effacés." : "La zone proposée et le parcours seront effacés.", ok: "Abandonner", cancel: "Continuer", abandon: true}
      : {title: "Abandonner cette zone ?", text: ui.mode === "rating" ? `Le tracé${draft.pendingPhotos && draft.pendingPhotos.length ? ", les photos" : ""} et les notes saisies seront perdus.` : "Les points déjà posés seront effacés.", ok: "Abandonner", cancel: "Continuer", abandon: true}))) return;
  const wasNew = !orig;
  cancelDraft();
  if (lose) toast(wasNew ? "Zone abandonnée" : "Modifications annulées");
}

/* État des échelles : note donnée, ou estimation proposée (modifiable) */
function paintCrits() {
  if (!draft) return;
  let any = false;
  $$(".crit", panel).forEach(row => {
    const id = row.dataset.c, u = userVal(draft, id), e = estScore(draft, id), why = estWhy(draft, id);
    const sel = u === undefined ? undefined : Math.floor(u);
    $$(".scale button[data-v]", row).forEach(b => {
      const n = +b.dataset.v, on = sel === n;
      b.setAttribute("aria-pressed", String(on));
      b.textContent = on && u !== n ? fmtNote(u) : n;
      b.style.setProperty("--c", colorFor((on ? u : n) * 20));
      b.classList.toggle("is-est", u === undefined && e === n);
      b.classList.toggle("est-mark", u !== undefined && e === n && u !== n);
    });
    const hb = row.querySelector("[data-half]");
    if (hb) {
      const base = u !== undefined ? u : e;
      hb.disabled = base === undefined || base >= 5;
      hb.setAttribute("aria-pressed", String(u !== undefined && !Number.isInteger(u)));
    }
    const box = row.querySelector(".crit__est");
    if (e === undefined && !why) { box.hidden = true; return; }
    any = any || e !== undefined;
    box.hidden = false;
    box.innerHTML = e === undefined ? esc(why)
      : u === undefined ? `<b>Estimé à ${e}</b> : ${esc(why)}.`
      : u === e ? `Comme l’estimation : ${esc(why)}.`
      : `Estimation ${e} : ${esc(why)}. <button type="button" class="linkbtn" data-reset>Revenir à l’estimation</button>`;
  });
  const zp = $("#zprice");
  if (zp && draft.est && draft.est.prix) zp.placeholder = "Médiane " + fmtInt(draft.est.prix.med);
  const src = $("#estSrc");
  if (src) { src.hidden = !any; src.textContent = "Les notes en pointillés sont estimées d’après les ventes DVF et OpenStreetMap, en comparant ce coin aux autres quartiers de Paris et de la petite couronne. Elles comptent dans la note tant que vous ne les changez pas : touchez une autre note pour la remplacer."; }
}
function updateScoreBox() {
  const box = $("#sbox"); if (!box) return;

  }
}

function commitDraft() {
  const pendRaw = draft.pendingPhotos || []; delete draft.pendingPhotos; delete draft.preparing;
  const z = finishZoneGeometry(clone(draft)); delete z.nameTouched; delete z.closed; delete z.walk;
  z.name = (z.name || "").trim() || z.place || "Zone sans nom";
  z.updatedAt = Date.now();
  if (z.id) {
    const i = state.zones.findIndex(x => x.id === z.id);
    if (i >= 0) state.zones[i] = Object.assign({}, state.zones[i], z, {example: false});
  } else {
    z.id = zoneId(); z.createdAt = Date.now(); z.author = state.profile.name || "";
    if (cloud.user) { z.mapId = cloud.mapId; z.createdBy = cloud.user.id; }
    state.zones.push(z);
  }
  save();
  draft = null; clearDraftLayers(); clearWalkTrace();
  selectedId = z.id; ui.mode = "detail";
  justSaved = z.id; setTimeout(() => { if (justSaved === z.id) justSaved = null; }, 1600);
  renderZones(); renderPanel();
  const pend = pendRaw;
  const saved = state.zones.find(x => x.id === z.id);
  toast(storageOk ? "Zone enregistrée" : "Zone ajoutée (non sauvegardée : stockage bloqué)");
  refreshEstimates();
  if (pend.length && saved && cloud.user) uploadPhotos(saved, pend, {done: pend.length > 1 ? `Zone enregistrée avec ses ${pend.length} photos` : "Zone enregistrée avec sa photo"}).then(() => walkPhotosClear());
  else if (pend.length) walkPhotosClear();
}

    geo.marker = L.marker(ll, {icon: meIcon, interactive: false, keyboard: false, zIndexOffset: -1000}).addTo(map);

function walkRuns(pts) {

  }
  const keep = [co[0]];                                          // un point tous les 10 m au moins
  for (const c of co.slice(1, -1)) { const l = keep[keep.length - 1]; if (distM({lat: l[0], lng: l[1]}, {lat: c[0], lng: c[1]}) >= 10) keep.push(c); }
  const mid = keep.slice(1);
  return mid.map((c, i) => [+c[0].toFixed(6), +c[1].toFixed(6), Math.round(a[2] + (b[2] - a[2]) * (i + 1) / (mid.length + 1)), 1]);

function onWalkPos(pt) {
  if (!walk.on || pt.acc > 40) return;                  // position trop imprécise : on attend la suivante
  const last = walk.pts[walk.pts.length - 1];
  const np = [+pt.lat.toFixed(6), +pt.lng.toFixed(6), pt.t];
  if (last) {
    const d = distM({lat: last[0], lng: last[1]}, pt), dt = (pt.t - last[2]) / 1000;
    if (d < 8) return;                                  // on ne bouge pas : pas de nouveau point
    if (dt > GAP_S && d > GAP_M) {                      // le suivi a été coupé : on reprend et on comble le trou
      if (d > 3000) np[3] = 1;                          // trop loin pour l'avoir fait à pied : simple liaison grise
      walk.pts.push(np); walkSave(); drawWalk(); paintWalk();
      if (d <= 3000) reconstructGap(last, np);
      return;
    }
    if (dt > 0 && d / dt > 7) return;                   // saut irréaliste à pied
  }
  walk.pts.push(np);

}

function loadTurf() {
  if (window.turf) return Promise.resolve(window.turf);
  return new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/@turf/turf@7.1.0/turf.min.js"; sc.onload = () => res(window.turf); sc.onerror = rej; document.head.appendChild(sc); });

/* Parcours -> zone : une bande de 60 m autour du chemin (les deux côtés de la rue), les boucles et les pâtés contournés sont remplis */
async function walkToZone(pts) {
  const T = await loadTurf();
  let co = pts.map(p => [p[1], p[0]]);
  co = co.map((c, i) => i === 0 || i === co.length - 1 ? c : [(co[i - 1][0] + c[0] + co[i + 1][0]) / 3, (co[i - 1][1] + c[1] + co[i + 1][1]) / 3]);
  const len = walkLen(pts), a = {lat: co[0][1], lng: co[0][0]}, b = {lat: co[co.length - 1][1], lng: co[co.length - 1][0]};
  if (len > 250 && distM(a, b) < Math.max(80, len * .2)) co.push(co[0]);      // retour près du départ : on ferme la boucle
  const buf = T.buffer(T.lineString(co), 30, {units: "meters"});
  const outers = buf.geometry.type === "MultiPolygon" ? buf.geometry.coordinates.map(p => p[0]) : [buf.geometry.coordinates[0]];
  let shape = T.polygon([outers.sort((x, y) => T.area(T.polygon([y])) - T.area(T.polygon([x])))[0]]);   // sans les trous
  for (const tol of [.00012, .00016, .0002, .0003, .0005]) {     // ≈ 10 m et plus : des coins nets, peu de points à ajuster
    shape = T.simplify(shape, {tolerance: tol, highQuality: true});
    if (shape.geometry.coordinates[0].length - 1 <= 12) break;
  }
  return shape.geometry.coordinates[0].slice(0, -1).map(([x, y]) => [y, x]);
}

function askConfirm({title, text = "", ok = "Confirmer", cancel = "Annuler", danger = false, abandon = false}) {
  return new Promise(resolve => {
    const prev = document.activeElement;
    const el = document.createElement("div");
    el.className = "ask";
    el.innerHTML = `<div class="ask__veil" data-no></div>
      <div class="ask__card" role="alertdialog" aria-modal="true" aria-labelledby="askT" aria-describedby="askD">
        <h2 id="askT">${esc(title)}</h2>${text ? `<p id="askD">${esc(text)}</p>` : ""}
        <div class="ask__acts"><button class="btn ${abandon ? "btn--primary" : ""}" type="button" data-no>${esc(cancel)}</button><button class="btn ${abandon ? "btn--clair" : danger ? "btn--danger" : "btn--primary"}" type="button" data-yes>${esc(ok)}</button></div>
      </div>`;
    document.body.appendChild(el);
    requestAnimationFrame(() => { el.classList.add("is-open"); el.querySelector(abandon ? "[data-no]" : "[data-yes]").focus({preventScroll: true}); });
    const done = v => {
      document.removeEventListener("keydown", key);
      el.classList.remove("is-open"); setTimeout(() => el.remove(), 180);
      try { prev && prev.focus && prev.focus({preventScroll: true}); } catch (e) {}
      resolve(v);
    };
    const key = e => { if (e.key === "Escape") { e.stopPropagation(); done(false); } };
    document.addEventListener("keydown", key);
    el.addEventListener("click", e => { if (e.target.closest("[data-yes]")) done(true); else if (e.target.closest("[data-no]")) done(false); });
  });
}

let toastT = null;
/* La notification cherche une place libre : sous les barres et consignes du haut, sinon au-dessus
   de la feuille ou de la barre du bas. Elle ne recouvre jamais une barre de balade, une consigne
   de tracé, la recherche, les boutons de carte ou une fenêtre ouverte. */
const TOAST_AVOID = ".topbar, .tabbar, .map-top, .walkbar, .hint, .fab-col, #mapf.is-open .mapf__opt, .panel, .ask__card, .auth__card, .lsheet, .quiz, .leaflet-control-attribution";
function placeToast(t) {
  const vv = window.visualViewport, vh = vv ? vv.height : innerHeight, vw = innerWidth, gap = 10;
  t.style.top = "0px";
  const r = t.getBoundingClientRect(), h = r.height, x0 = r.left, x1 = r.right;
  const safeTop = parseFloat(getComputedStyle($("#app")).paddingTop) || 0;
  const boxes = $$(TOAST_AVOID).filter(el => el !== t && !el.closest("[hidden]") && getComputedStyle(el).visibility !== "hidden" && +getComputedStyle(el).opacity > 0.05)
    .flatMap(el => [...el.getClientRects()]).filter(b => b.width > 1 && b.height > 1 && b.bottom > 0 && b.top < vh && b.right > x0 - 4 && b.left < x1 + 4);
  const free = y => y >= 0 && y + h <= vh && !boxes.some(b => y < b.bottom + gap / 2 && y + h > b.top - gap / 2);
  const tall = b => b.height > vh * 0.55;
  const yt = Math.max(safeTop + 12, ...boxes.filter(b => !tall(b) && b.top + b.height / 2 < vh / 2).map(b => b.bottom + gap));
  const yb = Math.min(vh - 16, ...boxes.filter(b => b.top + b.height / 2 >= vh / 2).map(b => b.top - gap)) - h;
  /* Carte : en haut, la feuille occupe le bas. Pages et fenêtres : en bas, loin des titres. */
  const onMap = document.body.dataset.tab === "map" && !document.querySelector(".ask.is-open, .auth.is-open");
  let y = [onMap ? yt : yb, onMap ? yb : yt].find(free);
  if (y == null) { const ys = [...boxes.map(b => b.bottom + gap), ...boxes.map(b => b.top - gap - h)].filter(free).sort((a, b) => a - b); y = ys.length ? ys[0] : yt; }
  t.style.top = Math.round(Math.max(8, Math.min(y, vh - h - 8))) + "px";
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false; t.style.opacity = "1";
  placeToast(t); requestAnimationFrame(() => placeToast(t)); setTimeout(() => !t.hidden && placeToast(t), 160);
  const ms = Math.min(6000, Math.max(2400, String(msg).length * 55));
  clearTimeout(toastT); toastT = setTimeout(() => { t.style.opacity = "0"; setTimeout(() => t.hidden = true, 200); }, ms);
}

/* =========================================================
   Compte et synchronisation (Supabase)
   - connexion par e-mail : lien magique ou code à 6 chiffres
   - la carte perso est créée au premier passage
   - les zones déjà saisies sur l'appareil sont reprises une seule fois
   - chaque modification est envoyée par différence (zone, note, profil)
   ========================================================= */
const CFG = window.HEDEN_CONFIG || {};
const cloudReady = !!(CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase && window.supabase.createClient);
const isUuid = s => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s || "");

function zoneRow(z) {
  return {id: z.id, map_id: z.mapId || cloud.mapId, created_by: z.createdBy || cloud.user.id, name: z.name || "", place: z.place || "",
    points: z.points, lat: z.lat ?? null, lng: z.lng ?? null, area: z.area ?? null, perimeter: z.perimeter ?? null, estimates: z.est || null, cover_photo: z.cover || null};
}
function ratingRow(z) {
  return {zone_id: z.id, user_id: cloud.user.id, ratings: z.ratings || {}, fav: !!z.fav, comment: z.comment || "",
    visit_date: z.date || null, moment: z.moment || "", price: z.price ?? null};
}
// Base pas encore migrée (supabase/annonces.sql) : on garde annonces et critères sur l'appareil
const schemaMissing = e => !!e && (/^(PGRST20[45]|42P01|42703)$/.test(e.code || "") || /schema cache|does not exist/i.test(e.message || ""));
function profileRow() {
  const p = state.profile;
  const row = {id: cloud.user.id, display_name: p.name || "", preset_id: p.presetId || null, modified: !!p.modified, budget: p.budget ?? null, criteria: p.criteria || [], half_points: !!p.halfPoints};
  if (!cloud.noHome) row.home = p.home || null;
  return row;
}
function listingRow(f) {
  const data = {}; Object.keys(f).forEach(k => { if (!["id", "status", "lat", "lng", "mapId", "createdBy", "url"].includes(k)) data[k] = f[k]; });
  return {id: f.id, map_id: f.mapId || cloud.mapId, created_by: f.createdBy || cloud.user.id, url: f.url || "", status: f.status || "nouvelle", lat: f.lat ?? null, lng: f.lng ?? null, data};
}
const listingFromRow = r => Object.assign({}, r.data || {}, {id: r.id, mapId: r.map_id, createdBy: r.created_by, url: r.url, status: r.status, lat: r.lat, lng: r.lng});
function snapshot() {
  const zones = {}, lst = {};
  if (!cloud.noListings) for (const f of state.listings || []) if (isUuid(f.id)) lst[f.id] = JSON.stringify(listingRow(f));
  for (const z of state.zones) {
    if (z.example || !isUuid(z.id) || !Array.isArray(z.points)) continue;
    zones[z.id] = {zone: JSON.stringify(zoneRow(z)), rating: JSON.stringify(ratingRow(z))};
  }
  return {zones, listings: lst, profile: JSON.stringify(profileRow())};
}
function hasPending() {
  if (!cloud.user) return false;
  const cur = snapshot(), prev = cloud.synced || {zones: {}, profile: null};
  if (cur.profile !== prev.profile) return true;
  if (Object.keys(prev.zones).some(id => !cur.zones[id])) return true;
  const pl = prev.listings || {};
  if (Object.keys(pl).some(id => !cur.listings[id]) || Object.entries(cur.listings).some(([id, v]) => pl[id] !== v)) return true;
  return Object.entries(cur.zones).some(([id, v]) => !prev.zones[id] || prev.zones[id].zone !== v.zone || prev.zones[id].rating !== v.rating);
}
function setCloudStatus(st, err) {
  cloud.status = st; cloud.error = err ? (err.message || String(err)) : "";
  const el = document.getElementById("syncState"); if (el) el.textContent = syncLabel();
  const el2 = document.getElementById("syncState2"); if (el2) el2.textContent = syncLabel();
  renderAccountChip();
  const al = document.querySelector(".acct-line"); if (al && cloud.user) { al.className = "acct-line " + (st === "error" ? "err" : "on"); al.querySelector("span").textContent = accountShort(); }
}
function accountShort() {
  if (!cloud.user) return "";
  if (cloud.status === "sync") return "Synchronisation…";
  if (cloud.status === "error") return "Connecté, synchronisation en attente";
  return "Connecté, " + (cloud.user.email || "");
}
function renderAccountChip() {
  const b = document.getElementById("acct"); if (!b) return;
  if (!cloudReady) { b.hidden = true; return; }
  b.hidden = false;
  b.className = "acct" + (cloud.user ? (cloud.status === "error" ? " err" : " on") : "");
  b.innerHTML = `<i></i><span>${cloud.user ? esc(cloud.user.email || "Connecté") : "Se connecter"}</span>`;
  b.title = cloud.user ? "Compte connecté : vos zones sont synchronisées" : "Se connecter pour retrouver ses zones sur tous ses appareils";
}
function syncLabel() {
  if (!cloud.user) return "";
  if (cloud.status === "sync") return "Synchronisation…";
  if (cloud.status === "error") return navigator.onLine === false ? "Hors ligne : vos modifications seront envoyées au retour du réseau." : "Synchronisation interrompue, nouvel essai dans quelques secondes.";
  if (cloud.lastSync) return "Synchronisé à " + cloud.lastSync.toLocaleTimeString("fr-FR", {hour: "2-digit", minute: "2-digit"}) + ".";
  return "Connecté.";
}
function scheduleSync(delay = 700) {
  if (!cloud.user) return;
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(syncNow, delay);
}
async function syncNow() {
  if (!cloud.user) return;
  if (cloud.busy) { cloud.again = true; return; }
  cloud.busy = true; setCloudStatus("sync");
  const c = cloud.client, cur = snapshot();
  const prev = cloud.synced ? JSON.parse(JSON.stringify(cloud.synced)) : {zones: {}, profile: null};
  try {
    if (cur.profile !== prev.profile) {
      let {error} = await c.from("profiles").upsert(Object.assign(JSON.parse(cur.profile), {updated_at: new Date().toISOString()}));
      if (error && !cloud.noHome && schemaMissing(error)) {
        cloud.noHome = true; cur.profile = JSON.stringify(profileRow());
        ({error} = await c.from("profiles").upsert(Object.assign(JSON.parse(cur.profile), {updated_at: new Date().toISOString()})));
      }
      if (error) throw error;
      prev.profile = cur.profile;
    }
    const zUp = [], rUp = [];
    for (const [id, v] of Object.entries(cur.zones)) {
      const old = prev.zones[id] || {};
      if (v.zone !== old.zone) zUp.push(Object.assign(JSON.parse(v.zone), {updated_at: new Date().toISOString()}));
      if (v.rating !== old.rating) rUp.push(Object.assign(JSON.parse(v.rating), {updated_at: new Date().toISOString()}));
    }
    const dels = Object.keys(prev.zones).filter(id => !cur.zones[id]);
    if (zUp.length) { const {error} = await c.from("zones").upsert(zUp); if (error) throw error; }
    if (rUp.length) { const {error} = await c.from("ratings").upsert(rUp); if (error) throw error; }
    await syncTwins(rUp);
    if (dels.length) { const {error} = await c.from("zones").delete().in("id", dels); if (error) throw error; }
    const pl = prev.listings || {}, lUp = Object.entries(cur.listings).filter(([id, v]) => pl[id] !== v).map(([, v]) => Object.assign(JSON.parse(v), {updated_at: new Date().toISOString()}));
    const lDel = Object.keys(pl).filter(id => !cur.listings[id]);
    if (lUp.length) {
      const {error} = await c.from("listings").upsert(lUp);
      if (error && schemaMissing(error)) { cloud.noListings = true; cur.listings = {}; }
      else if (error) throw error;
    }
    if (lDel.length) { const {error} = await c.from("listings").delete().in("id", lDel); if (error) throw error; }
    cloud.synced = cur; cloud.lastSync = new Date();
    try { localStorage.setItem("heden.cache." + cloud.user.id, JSON.stringify({state, synced: cloud.synced, mapId: cloud.mapId})); } catch (e) {}
    setCloudStatus("ok");
  } catch (err) {
    console.warn("Heden : synchronisation", err);
    setCloudStatus("error", err);
    clearTimeout(cloud.timer); cloud.timer = setTimeout(syncNow, 15000);
  } finally {
    cloud.busy = false;
    if (cloud.again) { cloud.again = false; scheduleSync(200); }
  }
}

function zoneFromRow(row) {
  const me = cloud.user.id;
  const rs = row.ratings || [];
  const mine = rs.find(r => r.user_id === me) || {};
  return finishZoneGeometry({
    id: row.id, mapId: row.map_id, createdBy: row.created_by, name: row.name, place: row.place, points: row.points, est: row.estimates || null, cover: row.cover_photo || null, link: row.link_zone || null,
    ratings: mine.ratings || {}, fav: !!mine.fav, comment: mine.comment || "", date: mine.visit_date || "", moment: mine.moment || "",

async function cloudLoad() {
  const c = cloud.client, me = cloud.user.id;
  setCloudStatus("sync");
  // 1. affichage immédiat depuis le cache de ce compte
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem("heden.cache." + me) || "null"); } catch (e) {}
  const localState = state;
  if (cached && cached.state) { state = cached.state; cloud.synced = cached.synced || null; state.zones.forEach(finishZoneGeometry); }
  rerenderAll();
  try {
    // 2. carte perso
    const {data: mapId, error: e1} = await c.rpc("ensure_personal_map"); if (e1) throw e1;
    cloud.personalMapId = mapId;
    await loadMaps();
    const known = id => cloud.maps.some(m => m.id === id);
    cloud.mapId = cached && known(cached.mapId) ? cached.mapId : mapId;
    if (cloud.mapId !== mapId && !known(cloud.mapId)) cloud.mapId = mapId;
    // 3. reprise, une seule fois, des zones saisies sur cet appareil avant la connexion
    const flag = "heden.migrated." + me;
    let migrated = false;
    try { migrated = !!localStorage.getItem(flag); } catch (e) {}
    if (!migrated) {
      const toMove = (localState.zones || []).filter(z => !z.example && Array.isArray(z.points) && !z.mapId);
      for (const z of toMove) {
        const copy = Object.assign({}, z, {id: isUuid(z.id) ? z.id : zoneId(), mapId, createdBy: me});
        if (!state.zones.some(x => x.id === copy.id)) state.zones.push(copy);
      }
      const lMove = (localState.listings || []).filter(f => !f.mapId);
      lMove.forEach(f => { f.mapId = mapId; f.createdBy = me; if (!(state.listings || []).some(x => x.id === f.id)) (state.listings = state.listings || []).push(f); });
      if (!cached) state.profile = localState.profile;
      try {
        localStorage.setItem(flag, "1");
        if (toMove.length) { localStorage.setItem(KEY + ".sauvegarde", JSON.stringify(localState)); localStorage.setItem(KEY, JSON.stringify(Object.assign({}, localState, {zones: []}))); }
      } catch (e) {}
      if (toMove.length) toast(`${toMove.length} zone${toMove.length > 1 ? "s" : ""} de cet appareil ajoutée${toMove.length > 1 ? "s" : ""} à votre compte`);
    }
    // 4. envoyer d'abord ce qui attend, puis afficher la carte choisie la dernière fois
    if (hasPending()) await syncNow();
    let pref = null;
    try { pref = localStorage.getItem("heden.map." + me); } catch (e) {}
    if (pref && pref !== cloud.mapId && known(pref)) resetForMap(pref);
    setupRealtime();
    await cloudRefresh(true);
    // 5. invitation reçue par lien
    let inv = null;
    try { inv = localStorage.getItem("heden.invite"); } catch (e) {}
    if (inv) { try { localStorage.removeItem("heden.invite"); } catch (e) {} await joinWithCode(inv); }
  } catch (err) {
    console.warn("Heden : chargement du compte", err);
    setCloudStatus("error", err);
    toast("Impossible de joindre la base pour l'instant. Vos zones restent sur l'appareil.");
  }
}

async function compressImage(file, max, q) {
  let img;
  try { img = await createImageBitmap(file, {imageOrientation: "from-image"}); }
  catch (e) { img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", q));
  return {blob, w: cv.width, h: cv.height};
}

async function uploadPhotos(z, items, opts = {}) {

  uploads.set(z.id, (uploads.get(z.id) || 0) + items.length); paintPhotos();

      row = {id, zone_id: target, user_id: cloud.user.id, path: base + ".jpg", thumb: base + "_t.jpg", width: full.w, height: full.h};
      let r = await cloud.client.from("zone_photos").insert(row); if (r.error) { row = null; throw r.error; }
      r = await st.upload(row.path, full.blob, {contentType: "image/jpeg", upsert: false}); if (r.error) throw r.error;
      r = await st.upload(row.thumb, th.blob, {contentType: "image/jpeg", upsert: false}); if (r.error) throw r.error;
      photoUrls.set(row.thumb, {url: URL.createObjectURL(th.blob), exp: Date.now() + 5 * 3600e3});
      photoUrls.set(row.path, {url: URL.createObjectURL(full.blob), exp: Date.now() + 5 * 3600e3});
      (z.photos = z.photos || []).push({id, zoneId: target, path: row.path, thumb: row.thumb, userId: cloud.user.id, w: full.w, h: full.h, at: new Date().toISOString()});

    }

}

async function syncTwins(rUp) {

  if (!isShared() || !cloud.personalMapId) return;
  for (const z of state.zones) {               // noter une zone de la carte commune la fait apparaître sur la carte perso
    if (z.example || !(hasRated(z) || z.createdBy === me) || cloud.twins[z.id] || !(cloud.synced && cloud.synced.zones[z.id]) && !rUp.some(r => r.zone_id === z.id)) continue;

async function switchMap(id) {
  if (!cloud.user || id === cloud.mapId || !cloud.maps.some(m => m.id === id)) return;
  clearTimeout(cloud.timer);
  for (let k = 0; cloud.busy && k < 100; k++) await new Promise(r => setTimeout(r, 100));
  if (hasPending()) await syncNow();
  if (hasPending()) { toast("Vos dernières modifications ne sont pas encore envoyées : réessayez dans un instant"); return; }
  if (draft) { draft = null; selVertex = null; clearDraftLayers(); clearWalkTrace(); setHint(null); }

function setupRealtime() {
  const c = cloud.client;
  if (cloud.channel) { try { c.removeChannel(cloud.channel); } catch (e) {} cloud.channel = null; }
  if (!cloud.mapId || typeof c.channel !== "function") return;
  let t = null;
  /* on attend un moment calme : pas de tracé en cours, pas de saisie, pas de fenêtre ouverte */
  const busy = () => !(ui.mode === "list" || ui.mode === "detail") || document.querySelector(".auth.is-open, .ask") || (document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
  const later = () => { clearTimeout(t); t = setTimeout(() => { if (busy()) later(); else cloudRefresh(true).catch(() => {}); }, 900); };
  try {
    let ch = c.channel("carte-" + cloud.mapId + "-" + cloud.user.id)
      .on("postgres_changes", {event: "*", schema: "public", table: "zones", filter: "map_id=eq." + cloud.mapId}, later)
      .on("postgres_changes", {event: "*", schema: "public", table: "listings", filter: "map_id=in.(" + myMapIds().join(",") + ")"}, later);
    if (isShared()) ch = ch.on("postgres_changes", {event: "*", schema: "public", table: "ratings"}, later);
    cloud.channel = ch.subscribe();
  } catch (e) { console.warn("Heden : temps réel", e); }
}
async function copyToMap(z, mapId, btn) {

    const id = zoneId(), now = new Date().toISOString();
    const row = Object.assign(zoneRow(z), {id, map_id: mapId, created_by: cloud.user.id, updated_at: now});
    if (hasPending()) await syncNow();
    let {error} = await cloud.client.from("zones").upsert(row); if (error) throw error;
    ({error} = await cloud.client.from("ratings").upsert(Object.assign(ratingRow(z), {zone_id: id, updated_at: now}))); if (error) throw error;
    const mine = (z.photos || []).filter(p => p.userId === cloud.user.id && (p.zoneId || z.id) === z.id);
    if (mine.length) { const r = await cloud.client.from("zone_photos").update({zone_id: id}).in("id", mine.map(p => p.id)); if (!r.error) mine.forEach(p => p.zoneId = id); }
    await cloud.client.from("zones").update({link_zone: id}).eq("id", z.id);

}

async function unlinkMap(mapId) {

  const pairs = (data || []).map(r => [r.id, cloud.twins[r.id]]).filter(([, t]) => t);
  for (const [sh, pe] of pairs) {
    await c.from("zone_photos").update({zone_id: pe}).eq("zone_id", sh).eq("user_id", me);
    await c.from("zones").update({link_zone: null}).eq("id", pe);

  }

async function cloudRefresh(force) {
  if (!cloud.user || !cloud.mapId) return;
  if (!force && (Date.now() - (cloud.lastRefresh || 0) < 45000)) return;
  if (hasPending()) { await syncNow(); if (hasPending()) return; }
  const c = cloud.client, me = cloud.user.id;
  const [{data: prof, error: e1}, {data: rows, error: e2}, {data: lrows, error: e3}] = await Promise.all([
    c.from("profiles").select("*").eq("id", me).maybeSingle(),
    c.from("zones").select("*, ratings(*)").eq("map_id", cloud.mapId),
    c.from("listings").select("*").in("map_id", myMapIds())
  ]);
  if (e1 || e2) { setCloudStatus("error", e1 || e2); return; }
  cloud.noListings = schemaMissing(e3);
  if (prof) cloud.noHome = !("home" in prof);
  const ids = new Set();
  (rows || []).forEach(r => { ids.add(r.created_by); (r.ratings || []).forEach(x => ids.add(x.user_id)); });
  (curMap() ? curMap().members : []).forEach(m => ids.add(m.userId));
  ids.delete(me);
  if (ids.size) await loadPeople([...ids]);
  let pushProfile = false;
  if (prof && Array.isArray(prof.criteria) && prof.criteria.length) {
    state.profile = {name: prof.display_name || "", presetId: prof.preset_id || null, modified: !!prof.modified, budget: prof.budget == null ? null : Number(prof.budget), criteria: prof.criteria, halfPoints: !!prof.half_points, home: cloud.noHome ? (state.profile && state.profile.home) : (prof.home || (state.profile && state.profile.home) || undefined)};
  } else pushProfile = true;   // compte neuf : on garde le profil de l'appareil
  const examples = cloud.mapId === cloud.personalMapId ? state.zones.filter(z => z.example) : [];
  const zoneIds = [...new Set((rows || []).flatMap(r => r.link_zone ? [r.id, r.link_zone] : [r.id]))], byZone = {};
  if (zoneIds.length) {
    const {data: ph} = await c.from("zone_photos").select("*").in("zone_id", zoneIds);
    (ph || []).sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)))
      .forEach(x => (byZone[x.zone_id] = byZone[x.zone_id] || []).push({id: x.id, zoneId: x.zone_id, path: x.path, thumb: x.thumb, userId: x.user_id, w: x.width, h: x.height, at: x.created_at}));
  }
  const before = new Set(state.zones.map(z => z.id));
  state.zones = (rows || []).map(r => Object.assign(zoneFromRow(r), {photos: [...(byZone[r.id] || []), ...(r.link_zone ? byZone[r.link_zone] || [] : [])]})).concat(examples);
  if (lrows) {
    // les annonces locales jamais envoyées (ajoutées hors ligne ou avant la migration) sont gardées
    const known = (cloud.synced && cloud.synced.listings) || {}, srv = new Set(lrows.map(r => r.id));
    const ids = myMapIds(), local = (state.listings || []).filter(f => !srv.has(f.id) && !known[f.id] && (!f.mapId || ids.includes(f.mapId)));
    // une même annonce enregistrée sur deux cartes n'apparaît qu'une fois : celle de la carte affichée d'abord
    const all = lrows.map(listingFromRow).concat(local).sort((a, b) => (b.mapId === cloud.mapId) - (a.mapId === cloud.mapId));
    const uniq = [];
    for (const f of all) if (!uniq.some(x => x.mapId !== f.mapId && sameListing(x, f))) uniq.push(f);
    state.listings = uniq.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
  }
  if (isShared()) {
    const st = seenSet(), u = cloud.unseen[cloud.mapId] = new Set();
    state.zones.forEach(z => { if (z.createdBy && z.createdBy !== me && !st.has(z.id)) u.add(z.id); });
    const fresh = before.size ? state.zones.filter(z => !before.has(z.id) && u.has(z.id)) : [];
    if (fresh.length) setTimeout(() => toast(fresh.length > 1 ? `${fresh.length} nouvelles zones de ${personName(fresh[0].createdBy)}` : `${personName(fresh[0].createdBy)} a ajouté « ${fresh[0].name || "une zone"} »`), 300);
  }
  signCovers();
  cloud.synced = snapshot();
  if (pushProfile) cloud.synced.profile = null;
  cloud.lastRefresh = Date.now(); cloud.lastSync = new Date();
  save();
  setCloudStatus("ok");
  rerenderAll();
  processInbox();
}

function cloudInit() {
  if (!cloudReady) return;
  cloud.client = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {
    auth: {flowType: "implicit", persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}
  });
  cloud.client.auth.onAuthStateChange((event, session) => {
    const u = session && session.user ? session.user : null;
    if (u && (!cloud.user || cloud.user.id !== u.id)) {
      cloud.user = u; cloud.step = "email"; cloud.synced = null; cloud.names = {};
      renderAccountChip();
      if (event === "SIGNED_IN") toast("Connecté : " + (u.email || ""));
      cloud.pendingEmail = ""; clearInterval(auth.timer); auth.cooldown = 0;
      if (auth.open) closeAuth();
      try { if (/(access_token|error)=/.test(location.hash)) history.replaceState(null, "", currentTab === "profile" ? "#profil" : "#carte"); } catch (e) {}
      setTimeout(cloudLoad, 0);
    } else if (!u && cloud.user) {
      if (cloud.channel) { try { cloud.client.removeChannel(cloud.channel); } catch (e) {} }
      Object.assign(cloud, {user: null, mapId: null, personalMapId: null, maps: [], people: {}, channel: null, invite: null, synced: null});
      setCloudStatus("local"); renderAccountChip();
      state = load() || defaultState(); state.zones.forEach(finishZoneGeometry);
      selectedId = null; ui.mode = "list";
      rerenderAll(); renderPanel();
      toast("Déconnecté");
    } else if (u) cloud.user = u;
  });
  window.addEventListener("online", () => scheduleSync(300));
  /* lien d'invitation : ?rejoindre=CODE */
  try {
    const sp = new URLSearchParams(location.search), inv = sp.get("rejoindre");
    if (inv) {
      localStorage.setItem("heden.invite", inv.trim().toUpperCase());
      history.replaceState(null, "", location.pathname + location.hash);
      setTimeout(() => { if (!cloud.user) openAuth("Votre binôme vous invite sur sa carte : connectez-vous pour la rejoindre."); }, 1200);
    }
  } catch (e) {}
  const hp = new URLSearchParams(location.hash.slice(1));
  if (hp.get("error_description") || hp.get("error_code")) {
    const code = hp.get("error_code") || "";
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    openAuth(/expired/.test(code) ? "Ce lien a expiré ou a déjà servi." : "Connexion impossible avec ce lien.");
  }
  const ab = document.getElementById("acct"); if (ab) ab.onclick = () => openAuth();
  renderAccountChip();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && cloud.user) cloudRefresh(false).catch(() => {}); });
}

/* ---------- Lecture d'une annonce (texte, balises de la page, données structurées) ---------- */
const numFR = s => { if (s == null) return null; const v = parseFloat(String(s).replace(/[\s  .](?=\d{3}\b)/g, "").replace(/\s/g, "").replace(",", ".")); return isFinite(v) ? v : null; };
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } };
function parseListing(src) {
  const meta = src.meta || {};
  const raw = [src.title, meta["og:title"], meta["og:description"] || meta.description, src.text].filter(Boolean).join("\n").replace(/[  ]/g, " ");
  const low = raw.toLowerCase();
  const nodes = [];

/* ---------- Corriger la note d'une annonce ----------

   chacun garde ses priorités, donc sa note. */

  let el = $("#lsheet");
  const closeSheet = () => { el.classList.remove("is-open"); setTimeout(() => { el.hidden = true; }, 200); };
  if (!el) { el = document.createElement("div"); el.id = "lsheet"; el.className = "auth"; el.innerHTML = `<div class="auth__veil" data-lclose></div><div class="auth__card lsheet" role="dialog" aria-modal="true" aria-labelledby="lsTitle"></div>`; document.body.appendChild(el); el.addEventListener("click", e => { if (e.target.closest("[data-lclose]")) closeSheet(); }); }
  const card = el.querySelector(".lsheet");

  const fx = {crit: {...((f.fix && f.fix.crit) || {})}, quartier: f.fix ? f.fix.quartier ?? null : null, total: f.fix ? f.fix.total ?? null : null};
  const crits = Object.entries(homeWeights()).filter(([, w]) => w > 0).sort((a, b) => b[1] - a[1]).map(([id]) => id);
  const preview = () => { const sv = f.fix; f.fix = fx; const r = scoreListing(f); f.fix = sv; return r; };
  const scale = (key, cur, est) => `<div class="scale" data-k="${key}">${[0, 1, 2, 3, 4, 5].map(n => `<button type="button" data-v="${n}" aria-pressed="${cur != null && Math.round(cur) === n}" class="${cur == null && est === n ? "is-est" : cur != null && est === n && Math.round(cur) !== n ? "est-mark" : ""}" style="--c:${colorFor(n * 20)}">${n}</button>`).join("")}</div>`;
  const draw = () => {
    const r = preview(), qa = raw.quartier != null ? Math.round(raw.quartier / 20) : null;

      <div class="fixsum"><b class="fixsum__s num" style="--c:${colorFor(r.total)}">${r.total ?? "–"}</b><span><b>${r.hasFix ? "Avec vos corrections" : "Analyse de Heden"}</b><small>${r.hasFix && raw.total != null ? `Heden seul : ${raw.total}. ` : ""}Vos corrections valent aussi pour votre binôme ; chacun garde ses priorités.</small></span></div>

      </section>
      <section class="fixsec"><h3>Le quartier</h3>
        <div class="fixrow"><div class="fixrow__l"><b>${raw.area && raw.area.zone ? `Zone « ${esc(raw.area.zone.name)} »` : "Le coin"}</b><small>${fx.quartier != null ? `Heden : ${raw.quartier ?? "inconnu"}` : raw.area ? (raw.area.zone ? `Note de la zone : ${raw.quartier}` : `Estimé à ${raw.quartier} d’après les données du coin`) : "Lieu inconnu"}</small></div>${scale("q", fx.quartier != null ? fx.quartier / 20 : null, qa)}</div>

        ${fx.total != null ? `<div class="fixrange"><input type="range" id="fxR" min="0" max="100" step="1" value="${fx.total}" aria-label="Note finale"><b class="num" id="fxV">${fx.total}</b></div><p class="hint2">La note ne bougera plus avec l’analyse ni avec vos priorités, tant qu’elle est fixée.</p>` : `<p class="hint2">À garder pour les cas où rien ci-dessus ne rend compte de votre avis.</p>`}

    $$(".scale button", card).forEach(b => b.onclick = () => {

    const rg = $("#fxR"); if (rg) rg.oninput = e => { fx.total = +e.target.value; $("#fxV").textContent = fx.total; const sum = $(".fixsum__s", card); sum.textContent = fx.total; sum.style.setProperty("--c", colorFor(fx.total)); };
    const rs = $("#fxReset"); if (rs) rs.onclick = () => { fx.crit = {}; fx.quartier = null; fx.total = null; draw(); };

/* ---------- Plusieurs annonces sur une page (résultats de recherche, e-mail d'alerte) ----------
   Fonction autonome : la même tourne dans la page visitée (bouton + Heden) et dans Heden (e-mails).
   Une « carte » est le plus grand bloc qui ne contient qu'un seul prix de vente. */
function extractCards(root, base) {
  const BLK = /^(DIV|P|TD|TH|TR|LI|BR|H[1-6]|TABLE|TBODY|SECTION|ARTICLE|UL|OL|HEADER|FOOTER|DL|DT|DD|FIGURE|FIGCAPTION|ASIDE|MAIN)$/i;

  const PR = /(\d{1,3}(?:[    .]\d{3})+|\d{5,8})\s?(?:€|eur\b|euros?\b)/gi;
  // loyers : un montant suivi de « /mois », « CC », « charges comprises » (ou sur une page de locations)
  const RR = /(\d{1,2}[\s\u00a0\u202f\u2009.]?\d{3}|\d{3,4})(?:[.,]\d{1,2})?\s?(?:€|eur\b|euros?\b)/gi;
  let page = ""; try { page = String(base || (root.ownerDocument && root.ownerDocument.defaultView && root.ownerDocument.defaultView.location.href) || ""); } catch (e) {}
  const rentPage = /\/locations?(?:[\/_-]|$)|\/louer|a-louer|transaction=location|categorie=locations/i.test(page);
  const prices = s => {
    const o = [];
    for (const m of s.matchAll(PR)) { const a = s.slice(m.index + m[0].length, m.index + m[0].length + 14).toLowerCase(); if (/^\s*(\/|par |le |du |hc|cc|charges)/.test(a)) continue; const v = +m[1].replace(/\D/g, ""); if (v >= 30000 && v <= 20000000) o.push(v); }
    for (const m of s.matchAll(RR)) {
      const a = s.slice(m.index + m[0].length, m.index + m[0].length + 20).toLowerCase(), b = s.slice(Math.max(0, m.index - 26), m.index).toLowerCase();
      if (/(dont|charges?|honoraires|frais|d[ée]p[ôo]t|garantie|caution|[ée]tat des lieux)[^\d]{0,18}$/.test(b) || /^\s*(hc\b|h\.c|hors charges|de charges|\/ ?m|par m|m²)/.test(a)) continue;
      const tagged = /^\s*(\/ ?mois|par mois|mensuel|cc\b|c\.c|charges comprises)/.test(a), v = +m[1].replace(/\D/g, "");

    }
    return o;
  };
  const cand = [];
  for (const el of root.querySelectorAll("*")) {
    if (SKIP.test(el.tagName)) continue;
    const t = el.textContent || ""; if (t.length > 160 || t.length < 5) continue;
    const p = prices(t); if (p.length) { el.__hp = p[0]; cand.push(el); }
  }
  const cs = new Set(cand);
  const mins = cand.filter(el => { for (const d of el.querySelectorAll("*")) if (cs.has(d)) return false; return true; });
  const cards = new Set();
  for (const pe of mins) {
    let card = pe;
    for (let p = pe.parentElement; p && p !== root.parentElement; p = p.parentElement) {
      const vals = new Set(); for (const x of mins) if (p.contains(x)) vals.add(x.__hp);
      if (vals.size > 1 || (p.textContent || "").length > 2500) break;
      card = p;
    }

  const HOUSE = /m²|m2\b|pi[eè]ces?\b|chambres?\b|studio|\b[TF][1-9]\b/i;
  const BAD = /unsub|d[ée]sabonn|d[ée]sinscri|preferen|mailto:|\/aide|help|contact|cgu|privacy|confidential|facebook|twitter|instagram|linkedin|youtube|apps\.apple|play\.google|tel:/i;
  const abs = h => { try { return new URL(h, base || undefined).href; } catch (e) { try { return new URL(h, root.ownerDocument.baseURI).href; } catch (e2) { return ""; } } };
  const out = [];
  for (const c of list) {
    const live = !!(c.ownerDocument && c.ownerDocument.defaultView);
    const text = String(live && c.innerText ? c.innerText : txt(c)).replace(/[ \t  ]+/g, " ").replace(/\n\s*\n+/g, "\n").trim();
    if (!HOUSE.test(text)) continue;
    const as = [c.closest && c.closest("a[href]"), ...c.querySelectorAll("a[href]")].filter(Boolean);
    let url = "", best = -1;
    for (const a of as) {
      const h = abs(a.getAttribute("href")); if (!/^https?:/i.test(h) || BAD.test(h)) continue;
      const sc = (a.querySelector("img") ? 2 : 0) + (prices(a.textContent || "").length ? 2 : 0) + (/annonce|detail|\/ad\/|-r\d{5,}|\.htm/i.test(h) ? 3 : 0) + (a === as[0] ? 1 : 0);
      if (sc > best) { best = sc; url = h; }
    }
    if (!url) continue;
    let img = "", area = 0;
    for (const i of c.querySelectorAll("img")) {
      const s = i.currentSrc || i.getAttribute("src") || i.getAttribute("data-src") || i.getAttribute("data-lazy-src") || i.getAttribute("data-original") || (i.getAttribute("srcset") || i.getAttribute("data-srcset") || "").split(/\s/)[0];

      const w = i.naturalWidth || +i.getAttribute("width") || 200, hh = i.naturalHeight || +i.getAttribute("height") || 150;

}

/* ---------- Placement sur la carte : géocodage en file (1 requête par seconde) et mémorisé ---------- */
const GEO_KEY = "heden.geo";
let geoCache = (() => { try { return JSON.parse(localStorage.getItem(GEO_KEY) || "{}"); } catch (e) { return {}; } })();
let geoLast = 0;

  if (Object.prototype.hasOwnProperty.call(geoCache, q)) return geoCache[q];
  const waitMs = geoLast + 1100 - Date.now(); if (waitMs > 0) await new Promise(r => setTimeout(r, waitMs));
  geoLast = Date.now();
  const vb = `${BOUNDS[0][1]},${BOUNDS[1][0]},${BOUNDS[1][1]},${BOUNDS[0][0]}`;
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(q)}&viewbox=${vb}&bounded=1&limit=1&countrycodes=fr&accept-language=fr`);
    if (!r.ok) return null;
    const j = await r.json(), res = j[0] ? {lat: +j[0].lat, lng: +j[0].lon} : null;
    geoCache[q] = res;
    const keys = Object.keys(geoCache); if (keys.length > 400) delete geoCache[keys[0]];

  } catch (e) { return null; }
}
async function geocodeListing(f) {
  if (f.lat && f.lng) return;

  const tries = [[f.metro && `${f.metro}, ${city || "Paris"}`, "metro"], [f.quartier && `${f.quartier}, ${city}`, "quartier"], [f.postcode && `${f.postcode} ${city}`, "cp"], [city, "ville"]].filter(x => x[0]);

/* ---------- Une annonce trouvée (page de résultats, alerte) : nouvelle, déjà connue, ou baisse de prix ---------- */
/* même annonce : même lien (sans paramètres, sauf liens de suivi des e-mails), ou mêmes caractéristiques */
const normUrl = u => { const x = String(u || "").split("#")[0]; return /emailing|click|track|link\.|\/c\//i.test(x) ? x : x.replace(/\?.*$/, ""); };
function sameListing(a, b) {
  if (a.url && b.url && normUrl(a.url) === normUrl(b.url)) return true;
  if (kindOf(a) !== kindOf(b)) return false;
  if (!a.price || !b.price || !a.surface || !b.surface) return false;
  if (Math.abs(a.surface - b.surface) > 1.5) return false;
  if (a.rooms && b.rooms && a.rooms !== b.rooms) return false;
  const placeA = a.postcode || a.city, placeB = b.postcode || b.city;
  if (!placeA || placeA !== placeB) return false;
  return Math.abs(a.price - b.price) / Math.max(a.price, b.price) < 0.2;
}
function mergeCard(card, opts = {}) {
  const f = parseListing({url: card.url, text: card.text, imgs: card.img ? [card.img] : []});
  if (!f.price || !(f.surface || f.rooms)) return {kind: "skip"};
  if (opts.onlyProject && projet() !== "deux" && kindOf(f) !== projet()) return {kind: "skip"};
  const ex = listings().find(x => sameListing(x, f));
  const now = opts.at || Date.now();
  if (ex) {
    if (opts.source && !(ex.sources || []).includes(opts.source)) ex.sources = (ex.sources || [ex.source].filter(Boolean)).concat(opts.source);
    ex.lastSeen = now;
    if (f.price !== ex.price) {
      ex.priceHistory = (ex.priceHistory || []).concat({price: ex.price, at: ex.priceAt || ex.addedAt || now});
      const down = f.price < ex.price; ex.price = f.price; ex.priceAt = now; ex.updatedAt = Date.now();
      if (down) { ex.dropped = true; if (ex.status === "ecartee" && opts.revive) ex.status = "nouvelle"; }
      return {kind: down ? "drop" : "change", f: ex};
    }
    return {kind: "seen", f: ex};
  }
  if (opts.dryRun) return {kind: "new", f};
  Object.assign(f, {id: zoneId(), status: "nouvelle", addedAt: Date.now(), firstSeen: now, lastSeen: now, origin: opts.origin || "page",
    source: opts.source || f.source, mapId: cloud.user ? cloud.mapId : null, createdBy: cloud.user ? cloud.user.id : null});
  if (card.img && !(f.photos || []).length) f.photos = [card.img];
  f.title = listingTitle(f);
  listings().unshift(f);
  return {kind: "new", f};
}

/* ---------- Annonce déjà connue, rouverte avec le bouton + Heden : on la met à jour ----------
   Prix (avec historique), disponibilité, agence, infos manquantes. Les corrections, notes,

function refreshFromPage(ex, p) {

  else {
    if (ex.gone) news.push("de nouveau en ligne");
    delete ex.gone;
    if (p.price && ex.price && p.price !== ex.price) {
      ex.priceHistory = (ex.priceHistory || []).concat({price: ex.price, at: ex.priceAt || ex.addedAt || now});
      news.push(p.price < ex.price ? `prix baissé de ${fmtInt(ex.price - p.price)} €` : `prix monté de ${fmtInt(p.price - ex.price)} €`);
      if (p.price < ex.price) ex.dropped = true;
      ex.price = p.price; ex.priceAt = now;
    }
    const keep = new Set(["id", "status", "lat", "lng", "precise", "mapId", "createdBy", "note", "fix", "addedAt", "firstSeen", "origin", "title", "price", "photos", "found", "url", "source", "sources", "est"]);

    }

      toast([added && `${added} nouvelle${added > 1 ? "s" : ""} annonce${added > 1 ? "s" : ""} de vos alertes`, drops && `${drops} baisse${drops > 1 ? "s" : ""} de prix`, gone && `${gone} annonce${gone > 1 ? "s" : ""} retirée${gone > 1 ? "s" : ""} du site`].filter(Boolean).join(", "));

function bindSources() {
  const box = $("#srcs"); if (!box) return;
  $$("[data-srct]", box).forEach(b => b.onclick = () => { const k = b.dataset.srct; srcUI.open = srcUI.open === k || (srcUI.open == null && box.querySelector(`[data-src="${k}"].is-open`)) ? "" : k; renderListings(); });
  $$("[data-os]", box).forEach(b => b.onclick = () => { srcUI.os = b.dataset.os; srcUI.open = "bouton"; renderListings(); });
  $$("[data-bmkcopy]", box).forEach(c => c.onclick = async () => { try { await navigator.clipboard.writeText(bookmarkletCode()); toast("Code copié : collez-le dans le signet"); } catch (e) { window.prompt("Copiez ce code :", bookmarkletCode()); } });
  const l = $(".bmk__link", box); if (l) l.onclick = e => { e.preventDefault(); l.classList.remove("bmk__link--nudge"); void l.offsetWidth; l.classList.add("bmk__link--nudge"); toast("Ne cliquez pas : glissez-le dans la barre des favoris"); };
  const p = $("#srcPaste"); if (p) p.onclick = () => openAddListing();
  const lg = $("#alLogin"); if (lg) lg.onclick = () => openAuth();
  const on = $("#alOn"), reset = $("#alReset");
  const mk = async btn => {
    btn.disabled = true;
    const {data, error} = await cloud.client.rpc("new_ingest_token");
    if (error || !data) { btn.disabled = false; return toast("Impossible de créer le script pour l’instant"); }
    cloud.alert = {token: data, last_at: null, received: 0}; srcUI.open = "alertes"; renderListings();
    try { await navigator.clipboard.writeText(gmailScript(data)); toast("Script copié : collez-le dans Google Apps Script"); } catch (e) {}
  };
  if (on) on.onclick = () => mk(on);
  if (reset) reset.onclick = async () => { if (await askConfirm({title: "Changer de script ?", text: "L’ancien script Gmail cessera d’envoyer vos alertes. Il faudra coller le nouveau.", ok: "Changer"})) mk(reset); };
  const cp = $("#alCopy"); if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText(gmailScript(cloud.alert.token)); toast("Script copié"); } catch (e) { window.prompt("Copiez ce script :", gmailScript(cloud.alert.token)); } };
  const am = $("#alMap"); if (am) am.onchange = e => { const h = homeProfile(); h.alerts = Object.assign({}, h.alerts, {mapId: e.target.value}); save(); toast("Les alertes iront sur cette carte"); };
}

/* ---------- Location : encadrement, coût d'entrée, taux d'effort, points de vigilance ----------
   Règles en vigueur : dépôt de garantie d'un mois hors charges (vide) ou deux (meublé) ; honoraires du locataire
   plafonnés par m² (zone très tendue : 12,10 € + 3,03 € pour l'état des lieux, baux signés depuis le 1er janvier 2026) ;
   logement classé G non décent, donc non louable, depuis 2025 ; complément de loyer interdit si DPE F ou G. */
const FEE_M2 = 12.10, FEE_EDL_M2 = 3.03;
function rentFacts(f) {
  const r = rentFor(f), surf = f.surface || null, cc = f.price || null;
  const hc = f.rentHC ?? (cc && f.rentCharges != null ? cc - f.rentCharges : null);
  const mb = f.furnished === true, part = f.seller === "particulier";
  const depMax = hc ? hc * (mb ? 2 : 1) : null, feeMax = surf ? surf * (FEE_M2 + FEE_EDL_M2) : null;
  let cap = null, capSrc = null, capLo = null, capHi = null;
  if (f.refMaj && surf) { cap = f.refMaj; capSrc = "annonce"; }
  else if (r && r.zone === "paris") { if (r.ep) { cap = r.max; capSrc = "quartier"; } else { capLo = r.maxLo; capHi = r.maxHi; capSrc = "quartier"; } }
  const ppmHC = hc && surf ? (hc - (f.complement || 0)) / surf : null;
  let verdict = null;
  if (ppmHC != null && cap) verdict = ppmHC <= cap + .05 ? "ok" : "over";
  else if (ppmHC != null && capLo) verdict = ppmHC <= capLo + .05 ? "ok" : ppmHC > capHi + .05 ? "over" : "depend";
  const over = verdict === "over" && surf ? Math.round(hc - (f.complement || 0) - (cap || capHi) * surf) : 0;
  return {r, surf, cc, hc, mb, part, depMax, feeMax, cap, capSrc, capLo, capHi, ppmHC, verdict, over};
}

  if (f.complement && (f.dpe === "F" || f.dpe === "G")) al.push(["over", "Complément de loyer interdit pour un logement classé F ou G."]);
  if (x.mb) al.push(["info", "Meublé : la loi impose un équipement minimum (literie, plaques, four ou micro-ondes, frigo avec congélateur, vaisselle, rangements, luminaires, rideaux dans les chambres). À vérifier à la visite."]);
  const vig = `<section class="lsec"><h2>Points de vigilance</h2>${al.length ? `<ul class="vig">${al.map(([c, t]) => `<li class="vig--${c}">${t}</li>`).join("")}</ul>` : `<p class="hint2">Rien à signaler d’après l’annonce.</p>`}</section>`;
  return enc + entry + eff + vig + tripsHTML(f);
}
function analysisHTML(f) {
  if (kindOf(f) === "location") return rentAnalysisHTML(f);
  const c = monthlyCost(f), com = commutes(f);
  const eur = v => fmtInt(Math.round(v)) + "&#8239;€";
  return `<section class="lsec" id="lfair"><h2>Le juste prix</h2><p class="hint2">Recherche des ventes comparables…</p></section>
    ${c ? `<section class="lsec"><h2>Coût réel par mois</h2>
      <div class="cost"><b class="num">≈ ${eur(c.total)}</b><span>par mois, tout compris</span></div>
      <div class="cost__bar">${c.parts.map(([, v, col]) => `<i style="flex:${v};background:${col}"></i>`).join("")}</div>
      <dl class="cost__leg">${c.parts.map(([n, v, col]) => `<div><dt><i style="background:${col}"></i>${n}${n === "Taxe foncière" && c.taxeEst ? " (estimée)" : n === "Énergie" ? " (selon DPE)" : ""}</dt><dd class="num">${eur(v)}</dd></div>`).join("")}</dl>
      <p class="hint2">Prêt de ${eur(c.pret)} sur ${c.fin.duree} ans à ${String(c.fin.taux).replace(".", ",")} %, frais de notaire de ${eur(c.notaire)}, apport ${c.apportDefault ? "supposé de 10 %" : "de " + eur(c.apport)}. <button class="link" type="button" id="finEdit">Modifier</button></p>
    </section>` : ""}
    ${com.length ? `<section class="lsec"><h2>Vos trajets</h2><div class="trips">${com.map(({p, min}) => `<a class="trip" href="https://www.google.com/maps/dir/?api=1&origin=${f.lat},${f.lng}&destination=${p.lat},${p.lng}&travelmode=${MODES[p.mode || "tc"][3]}" target="_blank" rel="noopener noreferrer">
        <b class="num">${min} min</b><span>${esc(p.label || p.q)} · ${MODES[p.mode || "tc"][0].toLowerCase()}</span><em>Itinéraire ↗</em></a>`).join("")}</div>
      <p class="hint2">Estimation d’après la distance${f.precise ? "" : " et une position approximative"}. Touchez un trajet pour l’itinéraire exact.</p></section>` : ""}`;
}
function fairHTML(f, cmp, ng) {
  const ppm = f.price && f.surface ? f.price / f.surface : null;
  if (!cmp) return `<h2>Le juste prix</h2><p class="hint2">${f.lat ? "Pas assez de ventes comparables autour pour juger le prix." : "Placez l’annonce sur la carte (code postal ou métro) pour la comparer aux ventes du quartier."}</p>`;
  const lo = Math.min(cmp.lo, ppm || cmp.lo), hi = Math.max(cmp.hi, ppm || cmp.hi), span = hi - lo || 1, pos = v => ((v - lo) / span * 100).toFixed(1);
  const verdictTxt = ng && ng.ecart != null ? (ng.ecart > 0.08 ? "Au-dessus du marché" : ng.ecart < -0.05 ? "Sous le marché" : "Dans le marché") : "";
  return `<h2>Le juste prix</h2>
    <div class="fair">
      <div><span class="label">Estimation</span><b class="num">${f.surface ? fmtInt(Math.round(cmp.med * f.surface / 5000) * 5) + "&#8239;k€" : fmtInt(cmp.med) + "&#8239;€/m²"}</b><small class="num">${fmtInt(cmp.med)}&#8239;€/m² médian</small></div>
      <div><span class="label">Annonce</span><b class="num">${f.price ? fmtInt(f.price / 1000) + "&#8239;k€" : "–"}</b><small class="num">${ppm ? fmtInt(ppm) + "&#8239;€/m²" : ""}</small>${verdictTxt ? `<em class="verd verd--${ng.ecart > 0.08 ? "haut" : ng.ecart < -0.05 ? "bas" : "ok"}">${verdictTxt}</em>` : ""}</div>
    </div>
    <div class="strip" aria-label="Prix au m² des ventes comparables">
      <span class="strip__iq" style="left:${pos(cmp.q1)}%;width:${(pos(cmp.q3) - pos(cmp.q1)).toFixed(1)}%"></span>
      ${cmp.all.map(x => `<i style="left:${pos(x.pa)}%"></i>`).join("")}
      ${ppm ? `<b class="strip__me" style="left:${pos(ppm)}%"><span class="num">${fmtInt(ppm)}</span></b>` : ""}
    </div>
    <div class="strip__ax num"><span>${fmtInt(lo)}</span><span>€/m²</span><span>${fmtInt(hi)}</span></div>
    <p class="hint2">${cmp.n} ventes d’appartements${f.surface ? " de taille proche" : ""} à moins de ${fmtInt(Math.round(cmp.R / 50) * 50)} m, sur 3 ans${cmp.adj ? ", ramenées aux prix d’aujourd’hui" : ""}. La bande montre la moitié centrale.</p>
    <ul class="comps">${cmp.near.map(x => `<li><span class="num">${fmtDist(x.d)}</span><span class="num">${fmtInt(x.s)} m²</span><span>${esc(monthLabel(x.m))}</span><b class="num">${fmtInt(x.pa)}&#8239;€/m²</b></li>`).join("")}</ul>
    ${ng ? `<div class="nego"><div><span class="label">Offre de départ envisageable</span><b class="num">${fmtInt(ng.offer)}&#8239;€</b><small class="num">−${Math.round(ng.m * 100)} % sur le prix affiché</small></div>
      <ul class="lwhy">${ng.why.map(w => `<li>${esc(w)}</li>`).join("")}</ul><p class="hint2">Indicatif : à confronter aux visites et à l’avis d’un professionnel.</p></div>` : ""}`;
}
async function paintFair(f) {
  const el = $("#lfair"); if (!el) return;
  let cmp = null; try { cmp = await comparables(f); } catch (e) {}
  const el2 = $("#lfair"); if (!el2 || lui.openId !== f.id) return;
  el2.innerHTML = fairHTML(f, cmp, negotiation(f, cmp));
}
function openFinance() {
  const fin = finance(), h = homeProfile();
  let el = $("#lsheet");
  if (!el) { el = document.createElement("div"); el.id = "lsheet"; el.className = "auth"; el.innerHTML = `<div class="auth__veil" data-lclose></div><div class="auth__card lsheet" role="dialog" aria-modal="true" aria-labelledby="lsTitle"></div>`; document.body.appendChild(el); }
  const card = el.querySelector(".lsheet"), closeSheet = () => { el.classList.remove("is-open"); setTimeout(() => { el.hidden = true; }, 200); };
  el.onclick = e => { if (e.target.closest("[data-lclose]")) closeSheet(); };
  card.innerHTML = `<div class="auth__head"><h2 id="lsTitle">Votre financement</h2><button class="x" type="button" data-lclose aria-label="Fermer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <p class="auth__txt">Sert au coût par mois de chaque annonce. Rien n’est partagé.</p>
    <form class="lform" id="finF">
      <label class="lf"><span>Apport</span><input name="apport" inputmode="numeric" value="${fin.apport ?? ""}" placeholder="10 % si vide"></label>
      <label class="lf"><span>Taux du prêt (%)</span><input name="taux" inputmode="decimal" value="${String(fin.taux).replace(".", ",")}"></label>
      <label class="lf"><span>Durée (années)</span><input name="duree" inputmode="numeric" value="${fin.duree}"></label>
    </form>
    <div class="auth__foot"><button class="btn btn--primary btn--block" type="button" id="finSave">Enregistrer</button></div>`;
  $("#finSave").onclick = () => {
    const fd = new FormData($("#finF")), a = numFR(fd.get("apport")), t = numFR(fd.get("taux")), d = numFR(fd.get("duree"));
    h.fin = {apport: a > 0 ? a : null, taux: t > 0 && t < 15 ? t : 3.4, duree: d >= 5 && d <= 30 ? Math.round(d) : 25};
    save(); closeSheet(); renderListings();
  };
  el.hidden = false; requestAnimationFrame(() => el.classList.add("is-open"));
}
function openRentSettings() {
  const h = homeProfile(), lo = h.loc;
  let el = $("#lsheet");
  if (!el) { el = document.createElement("div"); el.id = "lsheet"; el.className = "auth"; el.innerHTML = `<div class="auth__veil" data-lclose></div><div class="auth__card lsheet" role="dialog" aria-modal="true" aria-labelledby="lsTitle"></div>`; document.body.appendChild(el); }
  const card = el.querySelector(".lsheet"), closeSheet = () => { el.classList.remove("is-open"); setTimeout(() => { el.hidden = true; }, 200); };
  el.onclick = e => { if (e.target.closest("[data-lclose]")) closeSheet(); };
  card.innerHTML = `<div class="auth__head"><h2 id="lsTitle">Votre location</h2><button class="x" type="button" data-lclose aria-label="Fermer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <p class="auth__txt">Sert à filtrer les annonces et à calculer le taux d’effort. Rien n’est partagé.</p>
    <form class="lform" id="locF">
      <label class="lf"><span>Loyer maximum, charges comprises</span><input name="loyerMax" inputmode="numeric" value="${lo.loyerMax ?? ""}" placeholder="€ par mois"></label>
      <label class="lf"><span>Revenus nets du foyer</span><input name="revenus" inputmode="numeric" value="${lo.revenus ?? ""}" placeholder="€ par mois"></label>
      <label class="lf"><span>Meublé ou vide</span><select name="meuble">${[["indiff", "Peu importe"], ["vide", "Vide"], ["meuble", "Meublé"]].map(([v, l]) => `<option value="${v}" ${lo.meuble === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
    </form>
    <div class="auth__foot"><button class="btn btn--primary btn--block" type="button" id="locSave">Enregistrer</button></div>`;
  $("#locSave").onclick = () => {
    const fd = new FormData($("#locF")), m = numFR(fd.get("loyerMax")), r = numFR(fd.get("revenus"));
    h.loc = {loyerMax: m > 0 ? Math.round(m) : null, revenus: r > 0 ? Math.round(r) : null, meuble: fd.get("meuble") || "indiff"};
    save(); closeSheet(); rerenderAll(); if (currentTab === "profile") renderProfile();
  };
  el.hidden = false; requestAnimationFrame(() => el.classList.add("is-open"));
}

/* ---------- Annonces sur la carte ---------- */
let listingLayer = null;
function renderListingPins() {
  if (!listingLayer) listingLayer = L.layerGroup().addTo(map);
  listingLayer.clearLayers();
  if (mapFilter.annonces === false) return;
  modeListings().filter(f => f.lat && f.status !== "ecartee").forEach(f => {
    const s = scoreListing(f);
    const mk = L.marker([f.lat, f.lng], {icon: L.divIcon({className: "", iconSize: null, html: `<span class="lpin${f.status === "gardee" || f.status === "visite" ? " lpin--kept" : ""}${f.precise ? "" : " lpin--approx"}" style="--c:${colorFor(s.total)}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9H4z"/></svg><em class="num">${f.price ? (kindOf(f) === "location" ? fmtInt(f.price) + "&#8239;€" : Math.round(f.price / 1000) + "&#8239;k€") : ""}</em></span>`}), zIndexOffset: 500});
    mk.on("click", () => { lui.openId = f.id; setTab("annonces"); });
    mk.addTo(listingLayer);
  });
}


/* Démarrage */
renderZones();
setTab(/profil/.test(location.hash) ? "profile" : /annonces|import=/.test(location.hash) ? "annonces" : "map");
cloudInit();
refreshEstimates();
maybeAutoQuiz();
window.__heden = {state: () => state, scoreOf, colorFor, cloud: () => cloud, save, startNew, addPoint, estimate, map, toast, openQuiz, toastAvoid: TOAST_AVOID};
})();
</script>
