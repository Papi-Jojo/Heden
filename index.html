<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Heden</title>
<meta name="description" content="Notez les coins de Paris que vous visitez et repérez ceux qui vous correspondent.">
<meta name="theme-color" content="#F8F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#221F1B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Heden">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F3A6E'/%3E%3Cpolygon points='14.8,19.8 40.7,14.8 49.3,24.1 45.7,48.6 17.6,43.6' fill='%23F8F5F0' fill-opacity='.18' stroke='%23F8F5F0' stroke-width='2.6' stroke-linejoin='round'/%3E%3Ccircle cx='49.3' cy='24.1' r='3.9' fill='%23D4AF63'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Figtree:wght@400..800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
/* Heden — pierre, émail, laiton. La carte et les notes portent la couleur ; l'interface se tait. */
:root{
  --pierre:#ECE7DF; --calcaire:#F8F5F0; --enduit:#E2DCD2; --trait:#D5CDC1; --trait-fort:#857B6E;
  --ardoise:#26231F; --ardoise-2:#4F4943; --zinc:#5F5951;
  --email:#1F3A6E; --email-doux:#DCE2EC; --on-email:#F8F5F0;
  --laiton:#76591F; --laiton-vif:#A07B33; --alerte:#9E3A27; --on-score:#221F1B;
  --ombre-flottant:0 1px 2px rgba(38,35,31,.08),0 6px 18px rgba(38,35,31,.10);
  --ombre-feuille:0 -8px 28px rgba(38,35,31,.14);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --rayon-s:6px; --rayon-m:10px; --rayon-l:18px; --pilule:999px;
  --panel-w:384px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --pierre:#191714; --calcaire:#221F1B; --enduit:#2C2823; --trait:#3A352F; --trait-fort:#7A7166;
    --ardoise:#EEE8DF; --ardoise-2:#CFC7BB; --zinc:#A39B90;
    --email:#A9BCE4; --email-doux:#27334B; --on-email:#191714;
    --laiton:#D4AF63; --laiton-vif:#C79B4A; --alerte:#E68B73;
    --ombre-flottant:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.5); --ombre-feuille:0 -8px 28px rgba(0,0,0,.55);
    color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--pierre);color:var(--ardoise);font:400 15px/1.47 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--email);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:13px;font-weight:600;color:var(--ardoise-2)}

/* ---------- Structure ---------- */
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px)}
.topbar{display:flex;align-items:center;gap:20px;height:60px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));background:var(--calcaire);border-bottom:1px solid var(--trait);position:relative;z-index:1000}
.brand{display:flex;align-items:center;gap:9px;min-width:0;color:var(--ardoise);text-decoration:none}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font-family:var(--display);font-variation-settings:"wdth" 112;font-size:23px;font-weight:700;letter-spacing:-.015em;line-height:1}
.brand span{font-size:13px;color:var(--zinc);white-space:nowrap;margin-left:6px;padding-left:12px;border-left:1px solid var(--trait)}
.tabs{display:flex;gap:4px}
.acct{margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 10px;border-radius:var(--pilule);border:1px solid var(--trait);background:none;font-size:13px;font-weight:600;color:var(--ardoise-2);max-width:260px}
.acct i{width:8px;height:8px;border-radius:50%;background:var(--zinc);flex:none}
.acct.on i{background:var(--email)}
.acct.err i{background:var(--alerte)}
.acct span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct[hidden]+.tabs{margin-left:auto}
.compte--ok{border-color:var(--email);background:var(--email-doux)}
.acct-line{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:12.5px;color:var(--zinc)}
.acct-line i{width:7px;height:7px;border-radius:50%;background:var(--zinc);flex:none}
.acct-line.on i{background:var(--email)}
.acct-line.err i{background:var(--alerte)}
.tab{border:0;background:none;height:38px;padding:0 16px;border-radius:var(--pilule);font-weight:600;font-size:14px;color:var(--ardoise-2)}
.tab:hover{background:var(--enduit)}
.tab[aria-selected="true"]{background:var(--email);color:var(--on-email)}
.tabbar{display:none}
main{position:relative;min-height:0;grid-row:2}
.topbar{grid-row:1}
.tabbar{grid-row:3}
.view{position:absolute;inset:0}

/* ---------- Carte ---------- */
#view-map{display:grid;grid-template-columns:var(--panel-w) 1fr}
#map{position:relative;height:100%;min-width:0;background:#F3EEE5}
.leaflet-container{font-family:var(--sans);background:#F3EEE5}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--calcaire) 80%,transparent)!important;color:var(--zinc)}
.leaflet-control-attribution a{color:var(--ardoise-2)}
.map-top{position:absolute;z-index:600;top:14px;left:14px;right:14px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
.map-top>*{pointer-events:auto}
.search{position:relative;flex:1;max-width:400px}
.search input{width:100%;height:44px;border:1px solid var(--trait);border-radius:var(--pilule);background:var(--calcaire);padding:0 18px 0 42px;box-shadow:var(--ombre-flottant);outline:none}
.search input::placeholder{color:var(--zinc)}
.search input:focus{border-color:var(--email)}
.search svg{position:absolute;left:15px;top:14px;color:var(--zinc)}
.results{position:absolute;top:50px;left:0;right:0;background:var(--calcaire);border:1px solid var(--trait);border-radius:var(--rayon-m);box-shadow:var(--ombre-flottant);overflow:hidden}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 16px;border-top:1px solid var(--trait);font-size:14px;font-weight:600}
.results button:first-child{border-top:0}
.results button:hover{background:var(--enduit)}
.results small{display:block;color:var(--zinc);font-size:12.5px;font-weight:400}
.seg{display:inline-flex;gap:2px;background:var(--calcaire);border:1px solid var(--trait);border-radius:var(--pilule);padding:3px;box-shadow:var(--ombre-flottant);margin-left:auto}
.seg button{border:0;background:none;height:36px;padding:0 14px;border-radius:var(--pilule);font-size:13px;font-weight:600;color:var(--ardoise-2)}
.seg button[aria-pressed="true"]{background:var(--ardoise);color:var(--pierre)}
.fab-col{position:absolute;z-index:600;right:14px;bottom:128px;display:flex;flex-direction:column;gap:8px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--trait);background:var(--calcaire);border-radius:50%;box-shadow:var(--ombre-flottant);color:var(--ardoise)}
.leaflet-bottom.leaflet-right .leaflet-control-zoom{margin:0 14px 28px 0}
.leaflet-bar{border:1px solid var(--trait)!important;box-shadow:var(--ombre-flottant)!important;border-radius:22px!important;overflow:hidden}
.leaflet-bar a{width:42px!important;height:40px!important;line-height:40px!important;background:var(--calcaire)!important;color:var(--ardoise)!important;border-color:var(--trait)!important;font:500 20px/40px var(--sans)!important}
.hint{position:absolute;z-index:600;left:50%;top:70px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--ardoise);color:var(--pierre);padding:9px 16px 9px 12px;border-radius:var(--pilule);font-size:13.5px;font-weight:500;box-shadow:var(--ombre-flottant);white-space:nowrap}
.hint::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--calcaire);box-shadow:0 0 0 2px var(--email);flex:none}

/* Poignées de tracé */
.handle{border-radius:50%;background:var(--calcaire);border:2px solid var(--ardoise);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.handle--vertex{width:20px!important;height:20px!important;margin:-10px 0 0 -10px!important;cursor:grab}
.handle--first{width:26px!important;height:26px!important;margin:-13px 0 0 -13px!important;border:3px solid var(--email)}
.handle--sel{background:var(--ardoise);border-color:var(--calcaire)}
.handle--mid{width:14px!important;height:14px!important;margin:-7px 0 0 -7px!important;background:var(--email);opacity:.75;border:2px solid var(--calcaire);cursor:copy}
.zone-badge{display:inline-flex;align-items:center;gap:5px;transform:translate(-50%,-50%);height:26px;padding:0 10px 0 7px;border-radius:var(--pilule);background:var(--calcaire);color:var(--ardoise);font:700 12.5px/1 var(--sans);font-variant-numeric:tabular-nums;box-shadow:var(--ombre-flottant);white-space:nowrap}
.zone-badge i{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
.zone-badge svg{color:var(--laiton-vif)}
.map--far .zone-badge{display:none}

/* ---------- Panneau ---------- */
.panel{display:flex;flex-direction:column;min-height:0;background:var(--calcaire);border-right:1px solid var(--trait);z-index:700}
.panel__head{display:flex;align-items:flex-start;gap:12px;padding:20px 20px 16px;border-bottom:1px solid var(--trait)}
.panel__head h2{margin:0;font-family:var(--display);font-variation-settings:"wdth" 112;font-size:20px;line-height:26px;font-weight:650;letter-spacing:-.005em;text-wrap:balance}
.panel__head .sub{font-size:13.5px;line-height:19px;color:var(--ardoise-2);margin-top:4px}
.panel__head .grow{flex:1;min-width:0}
.sub--court{display:none}
.panel__body{flex:1;overflow:auto;padding:18px 20px 22px;display:flex;flex-direction:column;gap:20px;overscroll-behavior:contain}
.panel__foot{display:flex;gap:8px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--trait);background:var(--calcaire)}
.grip{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:var(--pilule);border:1px solid var(--trait-fort);background:var(--calcaire);font-weight:600;font-size:14.5px;white-space:nowrap;color:var(--ardoise)}
.btn:hover{border-color:var(--ardoise)}
.btn--primary{background:var(--email);color:var(--on-email);border-color:var(--email)}
.btn--primary:hover{border-color:var(--email)}
.btn--block{flex:1}
.btn--ghost{border-color:transparent;background:none;color:var(--ardoise-2)}
.btn--danger{color:var(--alerte);border-color:var(--alerte)}
.btn--danger.armed{background:var(--alerte);border-color:var(--alerte);color:var(--calcaire)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn--sm{height:36px;padding:0 14px;font-size:13.5px}
.link{border:0;background:none;padding:0;color:var(--email);text-decoration:underline;text-underline-offset:3px;font-size:13.5px;font-weight:600}

.legend{display:flex;flex-direction:column;gap:6px}
.legend__bar{height:10px;border-radius:var(--pilule);background:linear-gradient(90deg,var(--g))}
.legend__ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--zinc);font-variant-numeric:tabular-nums}

.zlist{display:flex;flex-direction:column;margin:0 -20px}
.zrow{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:14px;padding:12px 20px;border:0;border-top:1px solid var(--trait);background:none;text-align:left;width:100%}
.zrow:hover{background:var(--enduit)}
.zrow:last-child{border-bottom:1px solid var(--trait)}
.score-chip{width:48px;height:34px;border-radius:var(--rayon-m);display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--on-score);background:var(--c);font-variant-numeric:tabular-nums}
.score-chip.none{background:var(--enduit);color:var(--zinc)}
.zrow .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zrow .m{font-size:13px;color:var(--zinc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zrow>div{min-width:0}
.tags{display:flex;gap:6px;align-items:center}
.tag{font-size:11.5px;font-weight:600;border:1px solid var(--trait-fort);color:var(--ardoise-2);border-radius:var(--rayon-s);padding:2px 7px;white-space:nowrap}
.tag--alerte{color:var(--alerte);border-color:var(--alerte)}
.heart{color:var(--laiton-vif);display:inline-flex}

.empty{display:flex;flex-direction:column;gap:18px}
.empty>p{margin:0;font-size:14.5px;color:var(--ardoise-2)}
.empty ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0;counter-reset:s;position:relative}
.empty li{position:relative;display:grid;grid-template-columns:28px 1fr;gap:14px;font-size:14.5px;color:var(--ardoise-2);padding-bottom:18px}
.empty li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--calcaire);border:2px solid var(--ardoise);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ardoise);position:relative;z-index:1}
.empty li:not(:last-child)::after{content:"";position:absolute;left:13px;top:26px;bottom:0;border-left:2px dashed var(--email)}
.empty li:last-child{padding-bottom:0}

.field{display:flex;flex-direction:column;gap:7px}
.field input[type=text],.field input[type=number],.field input[type=date],.field textarea,.field select{width:100%;min-height:44px;border:1px solid var(--trait-fort);background:var(--calcaire);border-radius:var(--rayon-s);padding:10px 12px;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--email);box-shadow:0 0 0 1px var(--email)}
.field input::placeholder,.field textarea::placeholder{color:var(--zinc)}
.field textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.row2>*{min-width:0}
.field input,.field select,.field textarea{min-width:0;max-width:100%}
.datebox{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;height:44px;padding:0 12px;border:1px solid var(--trait-fort);border-radius:var(--rayon-s);background:var(--calcaire);color:var(--ardoise);overflow:hidden;min-width:0;cursor:pointer}
.datebox span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebox svg{flex:none;color:var(--zinc)}
.datebox:focus-within{border-color:var(--email);box-shadow:0 0 0 1px var(--email)}
.datebox input[type=date]{position:absolute;inset:0;width:100%;height:100%;min-width:0;margin:0;padding:0;border:0;opacity:0;-webkit-appearance:none;appearance:none;cursor:pointer;font-size:16px}
/* Safari iOS donne au champ date une largeur propre qui déborde : on le remet au gabarit des autres champs */
.field input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:44px;line-height:22px;text-align:left;background-color:var(--calcaire)}
.field input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.field input[type=date]::-webkit-calendar-picker-indicator{opacity:.6;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--trait-fort);background:none;border-radius:var(--pilule);height:36px;padding:0 13px;font-size:13.5px;font-weight:500;color:var(--ardoise-2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--email-doux);border-color:var(--email);color:var(--email)}
#zfav[aria-pressed="true"]{background:none;border-color:var(--laiton-vif);color:var(--laiton)}
#zfav[aria-pressed="false"] .heart{color:var(--zinc)}

.draw-stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--trait);border-radius:var(--rayon-m);overflow:hidden}
.draw-stats div{padding:12px 14px;border-left:1px solid var(--trait)}
.draw-stats div:first-child{border-left:0}
.draw-stats b{display:block;font-size:18px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.draw-stats span{font-size:12.5px;color:var(--zinc)}
.draw-actions{display:flex;flex-wrap:wrap;gap:8px}

.crit{display:flex;flex-direction:column;gap:9px;padding-bottom:16px;border-bottom:1px solid var(--trait)}
.crit:last-child{border-bottom:0;padding-bottom:0}
.crit__top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.crit__name{font-weight:600;font-size:15px}
.crit__w{font-size:12.5px;color:var(--zinc);white-space:nowrap;font-variant-numeric:tabular-nums}
.crit__desc{font-size:13px;color:var(--ardoise-2);margin-top:-5px}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.scale button{height:44px;border:1px solid var(--trait-fort);background:var(--calcaire);border-radius:var(--rayon-s);font-weight:650;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ardoise-2)}
.scale button:hover{border-color:var(--ardoise)}
.scale button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--on-score)}
.scale--half{grid-template-columns:repeat(6,1fr) 46px}
.scale button.half{font-size:14px;color:var(--ardoise-2)}
.scale button.half[aria-pressed="true"]{background:var(--email-doux);border-color:var(--email);color:var(--email)}
.scale button:disabled{opacity:.45;cursor:not-allowed}
.halfrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.halfrow .hint2{margin:0}
.scale button.is-est{background:color-mix(in srgb,var(--c) 32%,var(--calcaire));border:1.5px dashed var(--c);color:var(--ardoise)}
.scale button.est-mark{position:relative}
.scale button.est-mark::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px var(--calcaire)}
.crit__est{font-size:12.5px;line-height:17px;color:var(--zinc)}
.crit__est b{color:var(--ardoise-2);font-weight:650}
.linkbtn{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--email);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.est-src{margin:0;font-size:12px;line-height:17px;color:var(--zinc)}
.bd--est .bar i{opacity:.55}
.bd--est .v{color:var(--ardoise-2);font-weight:600}
.price{display:flex;flex-direction:column;gap:4px;padding:14px 0;border-top:1px solid var(--trait);border-bottom:1px solid var(--trait)}
.price__big{font-family:var(--display);font-variation-settings:"wdth" 100;font-size:26px;line-height:32px;font-weight:700;color:var(--ardoise)}
.price__sub{margin:0;font-size:13.5px;line-height:19px;color:var(--ardoise-2)}
.price__src{margin:2px 0 0;font-size:12px;color:var(--zinc)}

.plaque{display:inline-flex;align-self:flex-start;max-width:100%;padding:3px;border-radius:4px;background:var(--email)}
.plaque span{display:block;min-width:0;padding:6px 12px 5px;border:1.5px solid var(--on-email);border-radius:2px;color:var(--on-email);font-family:var(--display);font-variation-settings:"wdth" 75;font-size:14px;line-height:17px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plaque small{display:block;font-size:10.5px;line-height:13px;letter-spacing:.1em;font-weight:600;opacity:.85}

.scorebox{display:flex;align-items:center;gap:16px}
.scorebox .big{width:68px;height:68px;border-radius:14px;display:grid;place-items:center;font-size:30px;font-weight:800;color:var(--on-score);background:var(--c);font-variant-numeric:tabular-nums;flex:none}
.scorebox .big.none{background:var(--enduit);color:var(--zinc)}
.scorebox p{margin:0;font-size:13.5px;color:var(--zinc)}
.scorebox strong{display:block;font-family:var(--display);font-variation-settings:"wdth" 100;font-size:18px;line-height:23px;font-weight:650;color:var(--ardoise);margin-bottom:2px}

.breakdown{display:flex;flex-direction:column;gap:10px}
.bd{display:grid;grid-template-columns:1fr 96px 22px;gap:12px;align-items:center;font-size:14px}
.bd .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd .n small{color:var(--zinc);margin-left:6px;font-size:12px}
.bd .bar{height:6px;border-radius:var(--pilule);background:var(--enduit);overflow:hidden}
.bd .bar i{display:block;height:100%;background:var(--c);border-radius:var(--pilule)}
.bd .v{text-align:right;font-weight:700}
.meta{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:14px;margin:0}
.meta dt{color:var(--zinc)}
.meta dd{margin:0}
.note{font-size:14px;color:var(--ardoise-2);white-space:pre-wrap;padding:12px 14px;background:var(--pierre);border-radius:var(--rayon-m)}
.banner{font-size:13.5px;padding:11px 14px;border-radius:var(--rayon-m);background:var(--pierre);color:var(--ardoise-2)}
.banner--alerte{color:var(--alerte);background:none;border:1px solid var(--alerte)}

/* ---------- Profil ---------- */
#view-profile{overflow:auto;padding-block:40px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.prof{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
.prof h1{margin:0;font-family:var(--display);font-variation-settings:"wdth" 112;font-size:34px;line-height:38px;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.prof .lead{margin:10px 0 0;color:var(--ardoise-2);max-width:58ch;font-size:15.5px}
.sec{display:flex;flex-direction:column;gap:14px}
.sec h2{margin:0;font-family:var(--display);font-variation-settings:"wdth" 108;font-size:21px;line-height:27px;font-weight:650}
.sec .hint2{margin:-6px 0 0;font-size:14px;color:var(--ardoise-2);max-width:62ch}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px}
.preset{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--trait);background:var(--calcaire);border-radius:var(--rayon-m);padding:16px;position:relative}
.preset:hover{border-color:var(--trait-fort)}
.preset[aria-pressed="true"]{border:2px solid var(--email);padding:15px;background:var(--email-doux)}
.preset b{font-family:var(--display);font-variation-settings:"wdth" 100;font-size:16.5px;font-weight:650}
.preset p{margin:0;font-size:13.5px;line-height:19px;color:var(--ardoise-2)}
.preset .mini{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.preset .mini div{display:grid;grid-template-columns:minmax(0,1fr) 64px 34px;gap:8px;font-size:12.5px;color:var(--ardoise-2);align-items:center}
.preset .mini span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preset .mini i{height:4px;border-radius:2px;background:var(--trait);position:relative;overflow:hidden}
.preset .mini i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--email);border-radius:2px}
.preset .mini em{font-style:normal;text-align:right;color:var(--zinc);font-variant-numeric:tabular-nums}
.preset .cur{position:absolute;top:14px;right:14px;font-size:12px;font-weight:600;color:var(--email)}
.cards{display:flex;flex-direction:column;border:1px solid var(--trait);border-radius:var(--rayon-m);background:var(--calcaire);overflow:hidden}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 220px 36px;gap:18px;align-items:center;padding:14px 16px;border-top:1px solid var(--trait)}
.crow:first-child{border-top:0}
.crow input.nm{width:100%;border:0;background:none;padding:2px 0;font-weight:600;font-size:15px;outline:none;border-bottom:1px dashed transparent}
.crow input.nm:hover{border-bottom-color:var(--trait-fort)}
.crow input.nm:focus{border-bottom-color:var(--email)}
.crow input.ds{width:100%;border:0;background:none;padding:2px 0;font-size:13px;color:var(--ardoise-2);outline:none;border-bottom:1px dashed transparent}
.crow input.ds:focus{border-bottom-color:var(--email)}
.wctl{display:grid;grid-template-columns:1fr 62px;gap:12px;align-items:center}
.wctl input[type=range]{width:100%;accent-color:var(--email)}
.wctl output{text-align:right;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.wctl output small{display:block;color:var(--zinc);font-size:12px;font-weight:500}
.x{width:36px;height:36px;border-radius:50%;border:0;background:none;color:var(--zinc);display:grid;place-items:center}
.x.armed{color:var(--alerte);background:var(--enduit)}
.mapsw{display:inline-flex;gap:2px;padding:3px;margin-bottom:8px;border-radius:var(--pilule);border:1px solid var(--trait);background:var(--pierre);max-width:100%;overflow-x:auto}
.mapsw button{border:0;background:none;height:32px;padding:0 13px;border-radius:var(--pilule);font:600 13px/1 var(--sans);color:var(--ardoise-2);white-space:nowrap;cursor:pointer}
.mapsw button[aria-pressed="true"]{background:var(--email);color:var(--on-email)}
.duo{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:1px solid var(--trait);border-radius:var(--rayon-m)}
.duo__row{display:flex;align-items:center;gap:10px;font-size:14.5px}
.duo__row span:first-child{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duo__row b{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.duo__row b i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.duo__row em{font-style:normal;color:var(--zinc);font-size:13px}
.duo__row .heart{color:var(--laiton-vif)}
.duo__c{margin:-2px 0 0;font-size:13.5px;color:var(--ardoise-2);white-space:pre-wrap}
.duo__h{margin:2px 0 0;font-size:12px;color:var(--zinc)}
.mapcard{display:flex;flex-direction:column;gap:12px;padding:14px 16px;border:1px solid var(--trait);border-radius:var(--rayon-m);background:var(--calcaire);margin-bottom:12px}
.mapcard b{font-family:var(--display);font-variation-settings:"wdth" 100;font-size:16px}
.mapcard .hint2{margin:2px 0 0}
.invite{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:var(--rayon-m);background:var(--email-doux)}
.invite__code{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.14em;color:var(--email)}
.invite .hint2{margin:0}
.inline-form{display:flex;align-items:flex-end;gap:10px;margin-top:14px}
.inline-form .field{flex:1;min-width:0}
.x:hover{background:var(--enduit);color:var(--ardoise)}
.totals{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:13.5px;color:var(--zinc)}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow select{border:1px solid var(--trait-fort);border-radius:var(--pilule);background:var(--calcaire);padding:0 16px;height:44px;max-width:100%}
.datarow{display:flex;gap:8px;flex-wrap:wrap}
.compte{padding:20px;border:1px solid var(--trait);border-radius:var(--rayon-m);background:var(--calcaire)}
.compte__form{display:flex;flex-direction:column;gap:12px;max-width:420px}
.compte .hint2{margin:0}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ardoise);color:var(--pierre);padding:10px 18px;border-radius:var(--pilule);font-size:14px;font-weight:500;z-index:3000;box-shadow:var(--ombre-flottant);transition:opacity .2s;white-space:nowrap}

/* ---------- Mobile ---------- */
@media (max-width: 899px){
  .tabs{display:none}
  .topbar{height:54px}
  .brand span{display:none}
  .tabbar{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--trait);background:var(--calcaire);padding-bottom:env(safe-area-inset-bottom,0px);z-index:1000;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{border:0;background:none;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--zinc)}
  .tabbar button[aria-selected="true"]{color:var(--email)}
  .tabbar svg{width:22px;height:22px}
  #view-map{display:block}
  #map{position:absolute;inset:0}
  .panel{position:absolute;left:0;right:0;bottom:0;max-height:70%;border-right:0;border-radius:var(--rayon-l) var(--rayon-l) 0 0;box-shadow:var(--ombre-feuille)}
  .panel[data-mode="rating"],.panel[data-mode="detail"]{max-height:64%}
  .panel[data-mode="placing"] .sub--long,.panel[data-mode="placing"] .draw-stats{display:none}
  .panel[data-mode="placing"] .sub--court{display:block}
  .panel[data-mode="placing"] .panel__head{padding:22px 16px 10px;border-bottom:0}
  .panel[data-mode="placing"] .panel__head h2{font-size:18px;line-height:22px}
  .panel[data-mode="placing"] .panel__body{padding:0 16px 10px;gap:0;flex:none}
  .panel[data-mode="placing"] .panel__foot{padding-top:10px}
  .panel__head{padding-top:24px}
  .grip{display:block;position:absolute;top:9px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:var(--pilule);background:var(--trait-fort);opacity:.6}
  .panel{transition:transform .26s cubic-bezier(.2,.7,.2,1);will-change:transform}
  .panel.dragging{transition:none}
  .panel .grip,.panel .panel__head{touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .grip::before{content:"";position:absolute;inset:-12px -60px}
  .panel[data-sheet="peek"]{box-shadow:0 -4px 18px rgba(38,35,31,.10)}
  .panel__foot{padding-bottom:12px}
  .fab-col{bottom:auto;top:66px}
  .leaflet-control-zoom{display:none}
  .leaflet-bottom.leaflet-right{bottom:var(--sheet-h,0px)}
  .map-top .seg{margin-left:0}
  .search{max-width:none}
  .hint{top:66px;max-width:calc(100% - 92px);left:14px;transform:none;white-space:normal}
  .toast{top:calc(118px + env(safe-area-inset-top,0px))}
  .crow{grid-template-columns:minmax(0,1fr) 36px;gap:10px}
  .crow .wctl{grid-column:1 / -1;grid-row:2}
  #view-profile{padding-block:28px 48px}
  .prof h1{font-size:28px;line-height:32px}
  .field input,.field textarea,.field select,.search input,.crow input.nm,.addrow select{font-size:16px}
}
/* ---------- Économie d'espace sur mobile ----------
   Carte : pas d'en-tête (la carte occupe tout l'écran, le logo reste dans Profil).
   Tracé : pas de barre d'onglets ni de recherche, la consigne prend leur place.
   Notation : pas de barre d'onglets ni de contrôles de carte.
   Clavier ouvert : seule la saisie reste, le panneau prend toute la hauteur. */
@media (max-width: 899px){
  body[data-tab="map"] .topbar{display:none}
  body[data-tab="map"][data-mode="placing"] .tabbar,
  body[data-tab="map"][data-mode="rating"] .tabbar,
  body.kbd .tabbar{display:none}
  body[data-mode="placing"] .search{display:none}
  body[data-mode="placing"] .hint{top:66px}
  body[data-mode="rating"] .map-top,body[data-mode="rating"] .fab-col{display:none}
  body.kbd-panel .map-top,body.kbd-panel .fab-col,body.kbd-panel .hint{display:none}
  body.kbd-panel .panel{max-height:100%!important;border-radius:0;box-shadow:none}
  body.kbd-panel .panel .grip{display:none}
  body.kbd-panel .panel__head{padding-top:14px}
  body[data-tab="map"] .toast{top:calc(70px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<script>
(() => {
"use strict";

/* =========================================================
   Données de référence
   ========================================================= */
const LIB = {
  transports:  {name:"Transports", desc:"Métro, RER, bus à pied ; temps de trajet vers les lieux clés"},
  prix:        {name:"Prix au m² / budget", desc:"5 = nettement sous le budget, 0 = hors budget"},
  vie_sociale: {name:"Vie sociale", desc:"Bars, restaurants, culture à quelques minutes à pied"},
  securite:    {name:"Sécurité et ambiance", desc:"Ressenti de jour comme de soir, rue fréquentée et éclairée"},
  commerces:   {name:"Commerces du quotidien", desc:"Supermarché, boulangerie, pharmacie, marché à moins de 5 min"},

  revente:     {name:"Potentiel de revente", desc:"Dynamique des prix, projets de transport, demande"},
  velo:        {name:"Vélo", desc:"Pistes cyclables, stations Vélib’, stationnement vélo"},
  nuit:        {name:"Vie nocturne", desc:"Bars et sorties ouverts tard"},
  culture:     {name:"Culture", desc:"Cinémas, théâtres, musées, librairies"}
};
const PRESETS = [
  {id:"jeunes", name:"Jeunes actifs", tagline:"Premier achat à deux : vie de quartier, trajets courts, rue agréable",
   w:{transports:10,prix:15,vie_sociale:15,securite:15,commerces:10,nuisances:15,verts:5,bati:15}},
  {id:"famille", name:"Famille", tagline:"Écoles à pied, calme et espaces verts",
   w:{ecoles:20,securite:15,verts:15,nuisances:15,commerces:10,transports:10,prix:10,sante:5}},
  {id:"budget", name:"Budget serré", tagline:"Le meilleur rapport prix, accessibilité et revente",
   w:{prix:25,transports:20,revente:15,commerces:10,securite:10,vie_sociale:10,nuisances:10}},
  {id:"teletravail", name:"Télétravail", tagline:"On vit le quartier en journée : calme, cafés, verdure",
   w:{nuisances:20,verts:15,bati:15,commerces:15,securite:15,vie_sociale:10,prix:10}},
  {id:"invest", name:"Investissement locatif", tagline:"Demande locative et valeur à la revente",
   w:{prix:25,revente:25,transports:20,securite:10,commerces:10,vie_sociale:10}}
];
const MOMENTS = ["Semaine, journée","Semaine, soir","Week-end"];
/* Échelle des notes (DA Heden) : aplats et contours, du brique au vert des squares */
const STOPS = [[0,[217,120,95]],[25,[226,148,85]],[50,[226,182,84]],[75,[169,186,104]],[100,[118,180,154]]];
const TRAIT_JOUR = [[0,[158,58,39]],[25,[154,77,27]],[50,[125,94,14]],[75,[85,112,46]],[100,[38,97,79]]];
const TRAIT_NUIT = [[0,[230,139,115]],[25,[235,162,106]],[50,[230,194,107]],[75,[183,201,123]],[100,[140,199,174]]];
const BOUNDS = [[48.72,2.13],[48.99,2.57]];
const KEY = "ilot.v1";

/* =========================================================
   Utilitaires
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const zoneId = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); });
const clone = o => JSON.parse(JSON.stringify(o));
const fmtInt = n => Math.round(n).toLocaleString("fr-FR");
const fmtNote = v => Number.isInteger(v) ? String(v) : v.toLocaleString("fr-FR", {maximumFractionDigits: 1});
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => { try { return new Date(d + "T12:00:00").toLocaleDateString("fr-FR", {day:"numeric", month:"short", year:"numeric"}); } catch(e) { return d; } };
const HEART = '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>';

function interp(stops, score) {
  const s = Math.max(0, Math.min(100, score));
  for (let i = 1; i < stops.length; i++) {
    const [p1, c1] = stops[i - 1], [p2, c2] = stops[i];
    if (s <= p2) { const t = (s - p1) / (p2 - p1); const c = c1.map((v, k) => Math.round(v + (c2[k] - v) * t)); return `rgb(${c[0]},${c[1]},${c[2]})`; }
  }
  const c = stops[stops.length - 1][1]; return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function colorFor(score) { return score == null ? "#A39B90" : interp(STOPS, score); }
function traitMap(score) { return score == null ? "#857B6E" : interp(TRAIT_JOUR, score); }
function traitFor(score) { return score == null ? "#857B6E" : interp(window.matchMedia("(prefers-color-scheme: dark)").matches ? TRAIT_NUIT : TRAIT_JOUR, score); }
const GRADIENT = STOPS.map(([p, c]) => `rgb(${c.join(",")}) ${p}%`).join(",");
document.documentElement.style.setProperty("--g", GRADIENT);

/* =========================================================
   État et stockage local
   ========================================================= */
function presetCriteria(p) {
  return Object.entries(p.w).map(([id, w]) => ({id, name: LIB[id].name, desc: LIB[id].desc, weight: w}));
}
function defaultState() {
  return {version: 1, profile: {name: "", presetId: "jeunes", modified: false, budget: null, criteria: presetCriteria(PRESETS[0])}, zones: []};
}
let storageOk = true;

function handleIcon(cls, size) { return L.divIcon({className: "handle " + cls, iconSize: [size, size]}); }
function drawDraft() {
  clearDraftLayers();
  if (!draft) return;
  const pts = draft.points, c = draftColor(), editing = ui.mode === "placing", layers = [];
  if (pts.length >= 2) {
    const style = {color: c, weight: editing ? 2.5 : 3, dashArray: editing ? "7 6" : null, interactive: false};
    draftShape = (pts.length >= 3 || !editing) ? L.polygon(pts, Object.assign({fillColor: c, fillOpacity: editing ? .2 : .24}, style)) : L.polyline(pts, style);
    layers.push(draftShape.addTo(map));
  }
  if (editing && draft.closed) {
    pts.forEach((p, i) => {
      const q = pts[(i + 1) % pts.length];
      const m = L.marker([(p[0] + q[0]) / 2, (p[1] + q[1]) / 2], {draggable: true, keyboard: false, icon: handleIcon("handle--mid", 14), title: "Tirer pour ajouter un point"}).addTo(map);
      let idx = null;
      m.on("dragstart", () => { idx = i + 1; const ll = m.getLatLng(); draft.points.splice(idx, 0, [ll.lat, ll.lng]); });
      m.on("drag", () => { const ll = m.getLatLng(); draft.points[idx] = [ll.lat, ll.lng]; draftShape && draftShape.setLatLngs(draft.points); });
      m.on("dragend", () => { selVertex = idx; drawDraft(); renderPanel(); });
      m.on("click", () => { const ll = m.getLatLng(); draft.points.splice(i + 1, 0, [ll.lat, ll.lng]); selVertex = i + 1; drawDraft(); renderPanel(); });
      layers.push(m);

  }
  if (editing) {
    pts.forEach((p, i) => {
      const first = i === 0 && !draft.closed && pts.length >= 3;
      const v = L.marker(p, {draggable: true, keyboard: false, title: first ? "Fermer la zone" : "Déplacer ce point",
        icon: handleIcon("handle--vertex" + (first ? " handle--first" : "") + (selVertex === i ? " handle--sel" : ""), first ? 24 : 20)}).addTo(map);
      v.on("drag", () => { const ll = v.getLatLng(); draft.points[i] = [ll.lat, ll.lng]; draftShape && draftShape.setLatLngs(draft.points); });

let sheetDrag = null, suppressClick = false;
function peekHeight() { const h = panel.querySelector(".panel__head"); return h ? h.offsetTop + h.offsetHeight : 76; }
function sheetMax() { return Math.max(0, panel.offsetHeight - peekHeight()); }
function sheetOffset() { return ui.sheet === "peek" ? sheetMax() : 0; }
function setSheetVar(off) {
  const visible = isDesktop() ? 0 : panel.offsetHeight - off;
  document.getElementById("map").style.setProperty("--sheet-h", visible + "px");
}
function applySheet() {
  if (isDesktop()) { panel.style.transform = ""; panel.removeAttribute("data-sheet"); setSheetVar(0); return; }
  const off = sheetOffset();
  panel.dataset.sheet = ui.sheet;
  panel.style.transform = off ? `translateY(${off}px)` : "";

}
panel.addEventListener("pointerdown", e => {
  if (isDesktop() || !e.target.closest(".panel__head, .grip")) return;
  sheetDrag = {id: e.pointerId, y0: e.clientY, off0: sheetOffset(), max: sheetMax(), off: sheetOffset(), t0: performance.now(), moved: false};
});
window.addEventListener("pointermove", e => {
  const d = sheetDrag; if (!d || e.pointerId !== d.id) return;
  const dy = e.clientY - d.y0;
  if (!d.moved) {
    if (Math.abs(dy) < 6) return;
    d.moved = true; panel.classList.add("dragging");
    try { panel.setPointerCapture(d.id); } catch (err) {}
  }
  d.off = Math.min(d.max, Math.max(0, d.off0 + dy));

  setSheetVar(d.off);
}, {passive: true});

}

      </div>

  updateScoreBox();
  $("#zname").oninput = e => { draft.name = e.target.value; draft.nameTouched = true; };
  const zd = $("#zdate");
  zd.oninput = zd.onchange = e => { draft.date = e.target.value; $("#zdateTxt").textContent = draft.date ? fmtDate(draft.date) : "Choisir"; };
  zd.onclick = () => { try { zd.showPicker && zd.showPicker(); } catch (err) {} };

      const n = +b.dataset.v, u = userVal(draft, id);
      if (u !== undefined && Math.floor(u) === n) delete draft.ratings[id]; else draft.ratings[id] = n;
      paintCrits(); updateScoreBox();
    });
    const hb = row.querySelector("[data-half]");
    if (hb) hb.onclick = () => {
      const u = userVal(draft, id), base = u !== undefined ? u : estScore(draft, id);
      if (base === undefined || base >= 5) return;
      draft.ratings[id] = Number.isInteger(base) ? base + .5 : Math.floor(base);
      paintCrits(); updateScoreBox();
    };
    row.querySelector(".crit__est").onclick = e => {
      if (!e.target.closest("[data-reset]")) return;
      delete draft.ratings[id]; paintCrits(); updateScoreBox();
    };
  });

    const orig = draft.id && state.zones.find(x => x.id === draft.id);
    const dirty = orig ? pick(orig) !== pick(draft) : (Object.keys(draft.ratings || {}).length || draft.comment || draft.nameTouched || draft.fav || draft.price || draft.moment);
    if (dirty && !cx.classList.contains("armed")) {

    }

    cancelDraft();
    toast(wasNew ? "Zone abandonnée" : "Modifications annulées");
  };
}

/* État des échelles : note donnée, ou estimation proposée (modifiable) */
function paintCrits() {
  if (!draft) return;
  let any = false;
  $$(".crit", panel).forEach(row => {
    const id = row.dataset.c, u = userVal(draft, id), e = estScore(draft, id), why = estWhy(draft, id);
    const sel = u === undefined ? undefined : Math.floor(u);
    $$(".scale button[data-v]", row).forEach(b => {
      const n = +b.dataset.v, on = sel === n;
      b.setAttribute("aria-pressed", String(on));
      b.textContent = on && u !== n ? fmtNote(u) : n;
      b.style.setProperty("--c", colorFor((on ? u : n) * 20));
      b.classList.toggle("is-est", u === undefined && e === n);
      b.classList.toggle("est-mark", u !== undefined && e === n && u !== n);
    });
    const hb = row.querySelector("[data-half]");
    if (hb) {
      const base = u !== undefined ? u : e;
      hb.disabled = base === undefined || base >= 5;
      hb.setAttribute("aria-pressed", String(u !== undefined && !Number.isInteger(u)));
    }
    const box = row.querySelector(".crit__est");
    if (e === undefined && !why) { box.hidden = true; return; }
    any = any || e !== undefined;
    box.hidden = false;
    box.innerHTML = e === undefined ? esc(why)
      : u === undefined ? `<b>Estimé à ${e}</b> : ${esc(why)}.`
      : u === e ? `Comme l’estimation : ${esc(why)}.`
      : `Estimation ${e} : ${esc(why)}. <button type="button" class="linkbtn" data-reset>Revenir à l’estimation</button>`;
  });
  const src = $("#estSrc");
  if (src) { src.hidden = !any; src.textContent = "Les notes en pointillés sont estimées d’après les ventes DVF et OpenStreetMap, en comparant ce coin aux autres quartiers de Paris et de la petite couronne. Elles comptent dans la note tant que vous ne les changez pas : touchez une autre note pour la remplacer."; }
}
function updateScoreBox() {
  const box = $("#sbox"); if (!box) return;

  box.innerHTML = `
    <div class="big ${s.score == null ? "none" : ""}" style="--c:${col}">${s.score == null ? "–" : s.score}</div>

  if (draftShape) {
    if (s.score == null) draftShape.setStyle({color: draftColor(), fillColor: draftColor(), fillOpacity: .24});
    else draftShape.setStyle({color: traitMap(s.score), fillColor: col, fillOpacity: .34});
  }
}

function commitDraft() {

function priceHTML(z) {

  const tr = p.trend == null ? "" : Math.abs(p.trend) < 1 ? ", stable sur un an" : `, ${p.trend > 0 ? "+" : "−"}${Math.abs(p.trend)} % sur un an`;

}
function verdict(s) {
  if (s >= 80) return "Excellent coin";
  if (s >= 65) return "Très bon coin";
  if (s >= 50) return "Correct, avec des réserves";
  if (s >= 35) return "Peu convaincant";
  return "À éviter";
}

/* =========================================================
   Géocodage (Nominatim / OpenStreetMap)
   ========================================================= */
function arrLabel(pc, city) {
  if (pc && /^750\d\d$/.test(pc)) { const n = +pc.slice(3); return `Paris ${n === 1 ? "1er" : n + "e"}`; }
  if (pc === "75116") return "Paris 16e";
  return city || "";
}
async function reverseGeocode(d) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${d.lat}&lon=${d.lng}&zoom=17&addressdetails=1&accept-language=fr`);
    if (!r.ok) return;
    const j = await r.json(); const a = j.address || {};
    const place = arrLabel(a.postcode, a.city || a.town || a.village || a.municipality);
    const street = a.road || a.pedestrian || a.square || a.neighbourhood || a.quarter || a.suburb || "";
    if (draft !== d) return;
    if (place) d.place = place;
    if (!d.name && !d.nameTouched && street) {
      d.name = street + (a.quarter && a.quarter !== street ? ` (${a.quarter})` : "");
      const inp = $("#zname"); if (inp && !inp.value) inp.value = d.name;
    }
    const sub = $(".panel__head .sub"); if (sub && ui.mode === "rating" && place) sub.textContent = `${place}${d.area ? ", " + fmtArea(d.area) : ""}`;
  } catch (e) { /* hors ligne : on garde la saisie manuelle */ }
}
let searchTimer = null;
$("#q").addEventListener("input", e => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (q.length < 3) { $("#results").hidden = true; return; }
  searchTimer = setTimeout(() => doSearch(q), 450);
});
$("#search").addEventListener("submit", e => { e.preventDefault(); const q = $("#q").value.trim(); if (q) doSearch(q); });
async function doSearch(q) {
  const box = $("#results");
  try {
    const vb = `${BOUNDS[0][1]},${BOUNDS[1][0]},${BOUNDS[1][1]},${BOUNDS[0][0]}`;
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(q)}&viewbox=${vb}&bounded=1&limit=5&countrycodes=fr&accept-language=fr`);
    const list = r.ok ? await r.json() : [];
    if (!list.length) { box.innerHTML = `<button type="button" disabled>Aucun résultat dans Paris et la petite couronne</button>`; box.hidden = false; return; }
    box.innerHTML = list.map((x, i) => {
      const parts = x.display_name.split(", ");
      return `<button type="button" data-i="${i}">${esc(parts.slice(0, 2).join(", "))}<small>${esc(parts.slice(2, 5).join(", "))}</small></button>`;
    }).join("");
    box.hidden = false;
    $$("button", box).forEach(b => b.onclick = () => {
      const x = list[+b.dataset.i];
      map.flyTo([+x.lat, +x.lon], 16, {duration: .6});
      box.hidden = true; $("#q").blur();
    });
  } catch (e) {
    box.innerHTML = `<button type="button" disabled>Recherche indisponible pour le moment</button>`; box.hidden = false;
  }
}
document.addEventListener("click", e => { if (!e.target.closest("#search")) $("#results").hidden = true; });

$("#locate").onclick = () => {
  if (!navigator.geolocation) return toast("Géolocalisation indisponible");
  navigator.geolocation.getCurrentPosition(p => {
    const ll = L.latLng(p.coords.latitude, p.coords.longitude);
    if (!L.latLngBounds(BOUNDS).pad(0.25).contains(ll)) return toast("Vous êtes hors de la zone couverte");
    map.flyTo(ll, 16, {duration: .6});
  }, () => toast("Position refusée ou introuvable"), {enableHighAccuracy: true, timeout: 8000});
};

  };
  const cf = $("#codeForm");
  if (cf) cf.onsubmit = async e => {
    e.preventDefault();
    const code = $("#loginCode").value.trim();
    if (code.length < 6) return toast("Le code fait 6 chiffres");
    const b = cf.querySelector("button[type=submit]"); b.disabled = true; b.textContent = "Vérification…";
    try { await verifyLoginCode(cloud.pendingEmail, code); }
    catch (err) { b.disabled = false; b.textContent = "Se connecter"; toast("Code incorrect ou expiré"); }
  };
  const cm = $("#changeMail"); if (cm) cm.onclick = () => { cloud.step = "email"; renderProfile(); };
  const lo = $("#logout"); if (lo) lo.onclick = () => signOut();
}

function exportData() {
  const blob = new Blob([JSON.stringify({app: "heden", version: 1, exportedAt: new Date().toISOString(), profile: state.profile, zones: state.zones}, null, 2)], {type: "application/json"});
  const a = document.createElement("a");

  a.download = `heden-${(state.profile.name || "zones").toLowerCase().replace(/[^a-z0-9]+/g, "-")}-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove();

}
$("#importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!j || !Array.isArray(j.zones)) throw new Error("format");
    let added = 0, updated = 0;
    for (const z of j.zones) {
      const okPoly = Array.isArray(z.points) && z.points.length >= 3 && z.points.every(p => Array.isArray(p) && typeof p[0] === "number" && typeof p[1] === "number");
      const okCircle = typeof z.lat === "number" && typeof z.lng === "number" && typeof z.radius === "number";
      if (!okPoly && !okCircle) continue;
      finishZoneGeometry(z);
      z.ratings = z.ratings && typeof z.ratings === "object" ? z.ratings : {};
      const i = state.zones.findIndex(x => x.id === z.id);
      if (i < 0) { const nz = Object.assign({}, z, {id: zoneId(), example: false}); if (cloud.user) { nz.mapId = cloud.mapId; nz.createdBy = cloud.user.id; } state.zones.push(nz); added++; }
      else if ((z.updatedAt || 0) > (state.zones[i].updatedAt || 0)) { state.zones[i] = Object.assign({}, state.zones[i], z, {mapId: state.zones[i].mapId, createdBy: state.zones[i].createdBy}); updated++; }
    }
    const unknown = new Set();
    j.zones.forEach(z => Object.keys(z.ratings || {}).forEach(k => { if (!crit().some(c => c.id === k)) unknown.add(k); }));
    save(); renderProfile();
    toast(`${added} zone${added > 1 ? "s" : ""} ajoutée${added > 1 ? "s" : ""}${updated ? `, ${updated} mise${updated > 1 ? "s" : ""} à jour` : ""}`);
  } catch (err) { toast("Fichier illisible : choisissez un export Heden (.json)"); }
});

/* =========================================================
   Compte et synchronisation (Supabase)
   - connexion par e-mail : lien magique ou code à 6 chiffres
   - la carte perso est créée au premier passage
   - les zones déjà saisies sur l'appareil sont reprises une seule fois
   - chaque modification est envoyée par différence (zone, note, profil)
   ========================================================= */
const CFG = window.HEDEN_CONFIG || {};
const cloudReady = !!(CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase && window.supabase.createClient);
const isUuid = s => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s || "");

function zoneRow(z) {
  return {id: z.id, map_id: z.mapId || cloud.mapId, created_by: z.createdBy || cloud.user.id, name: z.name || "", place: z.place || "",
    points: z.points, lat: z.lat ?? null, lng: z.lng ?? null, area: z.area ?? null, perimeter: z.perimeter ?? null, estimates: z.est || null};
}
function ratingRow(z) {
  return {zone_id: z.id, user_id: cloud.user.id, ratings: z.ratings || {}, fav: !!z.fav, comment: z.comment || "",
    visit_date: z.date || null, moment: z.moment || "", price: z.price ?? null};
}
function profileRow() {
  const p = state.profile;
  return {id: cloud.user.id, display_name: p.name || "", preset_id: p.presetId || null, modified: !!p.modified, budget: p.budget ?? null, criteria: p.criteria || [], half_points: !!p.halfPoints};
}
function snapshot() {
  const zones = {};
  for (const z of state.zones) {
    if (z.example || !isUuid(z.id) || !Array.isArray(z.points)) continue;
    zones[z.id] = {zone: JSON.stringify(zoneRow(z)), rating: JSON.stringify(ratingRow(z))};
  }
  return {zones, profile: JSON.stringify(profileRow())};
}
function hasPending() {
  if (!cloud.user) return false;
  const cur = snapshot(), prev = cloud.synced || {zones: {}, profile: null};
  if (cur.profile !== prev.profile) return true;
  if (Object.keys(prev.zones).some(id => !cur.zones[id])) return true;
  return Object.entries(cur.zones).some(([id, v]) => !prev.zones[id] || prev.zones[id].zone !== v.zone || prev.zones[id].rating !== v.rating);
}
function setCloudStatus(st, err) {
  cloud.status = st; cloud.error = err ? (err.message || String(err)) : "";
  const el = document.getElementById("syncState"); if (el) el.textContent = syncLabel();
  renderAccountChip();
  const al = document.querySelector(".acct-line"); if (al && cloud.user) { al.className = "acct-line " + (st === "error" ? "err" : "on"); al.querySelector("span").textContent = accountShort(); }
}
function accountShort() {
  if (!cloud.user) return "";
  if (cloud.status === "sync") return "Synchronisation…";
  if (cloud.status === "error") return "Connecté, synchronisation en attente";
  return "Connecté, " + (cloud.user.email || "");
}
function renderAccountChip() {
  const b = document.getElementById("acct"); if (!b) return;
  if (!cloudReady) { b.hidden = true; return; }
  b.hidden = false;
  b.className = "acct" + (cloud.user ? (cloud.status === "error" ? " err" : " on") : "");
  b.innerHTML = `<i></i><span>${cloud.user ? esc(cloud.user.email || "Connecté") : "Se connecter"}</span>`;
  b.title = cloud.user ? "Compte connecté : vos zones sont synchronisées" : "Se connecter pour retrouver ses zones sur tous ses appareils";
}
function syncLabel() {
  if (!cloud.user) return "";
  if (cloud.status === "sync") return "Synchronisation…";
  if (cloud.status === "error") return navigator.onLine === false ? "Hors ligne : vos modifications seront envoyées au retour du réseau." : "Synchronisation interrompue, nouvel essai dans quelques secondes.";
  if (cloud.lastSync) return "Synchronisé à " + cloud.lastSync.toLocaleTimeString("fr-FR", {hour: "2-digit", minute: "2-digit"}) + ".";
  return "Connecté.";
}
function scheduleSync(delay = 700) {
  if (!cloud.user) return;
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(syncNow, delay);
}
async function syncNow() {
  if (!cloud.user) return;
  if (cloud.busy) { cloud.again = true; return; }
  cloud.busy = true; setCloudStatus("sync");
  const c = cloud.client, cur = snapshot();
  const prev = cloud.synced ? JSON.parse(JSON.stringify(cloud.synced)) : {zones: {}, profile: null};
  try {
    if (cur.profile !== prev.profile) {
      const {error} = await c.from("profiles").upsert(Object.assign(JSON.parse(cur.profile), {updated_at: new Date().toISOString()}));
      if (error) throw error;
      prev.profile = cur.profile;
    }
    const zUp = [], rUp = [];
    for (const [id, v] of Object.entries(cur.zones)) {
      const old = prev.zones[id] || {};
      if (v.zone !== old.zone) zUp.push(Object.assign(JSON.parse(v.zone), {updated_at: new Date().toISOString()}));
      if (v.rating !== old.rating) rUp.push(Object.assign(JSON.parse(v.rating), {updated_at: new Date().toISOString()}));
    }
    const dels = Object.keys(prev.zones).filter(id => !cur.zones[id]);
    if (zUp.length) { const {error} = await c.from("zones").upsert(zUp); if (error) throw error; }
    if (rUp.length) { const {error} = await c.from("ratings").upsert(rUp); if (error) throw error; }
    if (dels.length) { const {error} = await c.from("zones").delete().in("id", dels); if (error) throw error; }
    cloud.synced = cur; cloud.lastSync = new Date();
    try { localStorage.setItem("heden.cache." + cloud.user.id, JSON.stringify({state, synced: cloud.synced, mapId: cloud.mapId})); } catch (e) {}
    setCloudStatus("ok");
  } catch (err) {
    console.warn("Heden : synchronisation", err);
    setCloudStatus("error", err);
    clearTimeout(cloud.timer); cloud.timer = setTimeout(syncNow, 15000);
  } finally {
    cloud.busy = false;
    if (cloud.again) { cloud.again = false; scheduleSync(200); }
  }
}

function zoneFromRow(row) {
  const me = cloud.user.id;
  const rs = row.ratings || [];
  const mine = rs.find(r => r.user_id === me) || {};

    id: row.id, mapId: row.map_id, createdBy: row.created_by, name: row.name, place: row.place, points: row.points, est: row.estimates || null,
    ratings: mine.ratings || {}, fav: !!mine.fav, comment: mine.comment || "", date: mine.visit_date || "", moment: mine.moment || "",
    price: mine.price == null ? null : Number(mine.price),
    author: row.created_by === me ? (state.profile.name || "") : (cloud.names[row.created_by] || ""),
    others: rs.filter(r => r.user_id !== me).map(r => ({userId: r.user_id, name: cloud.names[r.user_id] || "", ratings: r.ratings || {}, fav: !!r.fav, comment: r.comment || ""})),
    createdAt: Date.parse(row.created_at) || Date.now(), updatedAt: Date.parse(row.updated_at) || Date.now()
  });
}

async function cloudLoad() {
  const c = cloud.client, me = cloud.user.id;
  setCloudStatus("sync");
  // 1. affichage immédiat depuis le cache de ce compte
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem("heden.cache." + me) || "null"); } catch (e) {}
  const localState = state;
  if (cached && cached.state) { state = cached.state; cloud.synced = cached.synced || null; state.zones.forEach(finishZoneGeometry); }
  rerenderAll();
  try {
    // 2. carte perso
    const {data: mapId, error: e1} = await c.rpc("ensure_personal_map"); if (e1) throw e1;
    cloud.personalMapId = mapId;
    await loadMaps();
    const known = id => cloud.maps.some(m => m.id === id);
    cloud.mapId = cached && known(cached.mapId) ? cached.mapId : mapId;
    if (cloud.mapId !== mapId && !known(cloud.mapId)) cloud.mapId = mapId;
    // 3. reprise, une seule fois, des zones saisies sur cet appareil avant la connexion
    const flag = "heden.migrated." + me;
    let migrated = false;
    try { migrated = !!localStorage.getItem(flag); } catch (e) {}
    if (!migrated) {
      const toMove = (localState.zones || []).filter(z => !z.example && Array.isArray(z.points) && !z.mapId);
      for (const z of toMove) {
        const copy = Object.assign({}, z, {id: isUuid(z.id) ? z.id : zoneId(), mapId, createdBy: me});
        if (!state.zones.some(x => x.id === copy.id)) state.zones.push(copy);
      }
      if (!cached) state.profile = localState.profile;
      try {
        localStorage.setItem(flag, "1");
        if (toMove.length) { localStorage.setItem(KEY + ".sauvegarde", JSON.stringify(localState)); localStorage.setItem(KEY, JSON.stringify(Object.assign({}, localState, {zones: []}))); }
      } catch (e) {}
      if (toMove.length) toast(`${toMove.length} zone${toMove.length > 1 ? "s" : ""} de cet appareil ajoutée${toMove.length > 1 ? "s" : ""} à votre compte`);
    }
    // 4. envoyer d'abord ce qui attend, puis afficher la carte choisie la dernière fois
    if (hasPending()) await syncNow();
    let pref = null;
    try { pref = localStorage.getItem("heden.map." + me); } catch (e) {}
    if (pref && pref !== cloud.mapId && known(pref)) resetForMap(pref);
    setupRealtime();
    await cloudRefresh(true);
    // 5. invitation reçue par lien
    let inv = null;
    try { inv = localStorage.getItem("heden.invite"); } catch (e) {}
    if (inv) { try { localStorage.removeItem("heden.invite"); } catch (e) {} await joinWithCode(inv); }
  } catch (err) {
    console.warn("Heden : chargement du compte", err);
    setCloudStatus("error", err);
    toast("Impossible de joindre la base pour l'instant. Vos zones restent sur l'appareil.");
  }
}

/* ---------- Cartes : perso et partagées ---------- */
async function loadPeople(ids) {
  const {data: ps} = await cloud.client.from("profiles").select("id, display_name, criteria, budget, half_points").in("id", ids);
  (ps || []).forEach(x => {
    cloud.names[x.id] = x.display_name || "";
    cloud.people[x.id] = {name: x.display_name || "", criteria: Array.isArray(x.criteria) ? x.criteria : [], budget: x.budget == null ? null : Number(x.budget)};
  });
}
async function loadMaps() {
  const me = cloud.user.id;
  const {data, error} = await cloud.client.from("maps").select("id, name, kind, owner, created_at, map_members(user_id, role)");
  if (error) throw error;
  cloud.maps = (data || []).map(m => ({id: m.id, name: m.name, kind: m.kind, owner: m.owner, createdAt: m.created_at,
      members: (m.map_members || []).map(x => ({userId: x.user_id, role: x.role}))}))
    .sort((a, b) => (a.kind === "perso" ? 0 : 1) - (b.kind === "perso" ? 0 : 1) || String(a.createdAt).localeCompare(String(b.createdAt)));
  const ids = [...new Set(cloud.maps.flatMap(m => m.members.map(x => x.userId)))].filter(id => id !== me);
  if (ids.length) await loadPeople(ids);
}
const mapLabel = m => m.kind === "perso" ? "Ma carte" : m.name;
function membersLabel(m) {
  const others = m.members.filter(x => x.userId !== cloud.user.id).map(x => personName(x.userId));
  return others.length ? "Vous et " + others.join(", ") : "Vous seul pour l’instant : invitez votre binôme";
}
function duoLine(z) {
  const parts = [hasRated(z) ? `vous ${scoreOf(z).score ?? "–"}` : null, ...partnerScores(z).map(p => `${p.name} ${p.s.score ?? "–"}`)].filter(Boolean);
  return parts.length ? " · " + parts.join(", ") : " · pas encore notée";
}
function mapSwitchHTML() {
  if (!cloud.user || cloud.maps.length < 2) return "";
  return `<div class="mapsw" role="group" aria-label="Carte affichée">${cloud.maps.map(m =>
    `<button type="button" data-map="${m.id}" aria-pressed="${m.id === cloud.mapId}">${esc(mapLabel(m))}</button>`).join("")}</div>`;
}
let stashedExamples = [];
function resetForMap(id) {
  if (cloud.mapId === cloud.personalMapId) stashedExamples = state.zones.filter(z => z.example);
  cloud.mapId = id;
  state.zones = id === cloud.personalMapId ? stashedExamples : [];
  cloud.synced = {zones: {}, profile: cloud.synced ? cloud.synced.profile : null};
  try { localStorage.setItem("heden.map." + cloud.user.id, id); } catch (e) {}
}
async function switchMap(id) {
  if (!cloud.user || id === cloud.mapId || !cloud.maps.some(m => m.id === id)) return;
  clearTimeout(cloud.timer);
  for (let k = 0; cloud.busy && k < 100; k++) await new Promise(r => setTimeout(r, 100));
  if (hasPending()) await syncNow();
  if (hasPending()) { toast("Vos dernières modifications ne sont pas encore envoyées : réessayez dans un instant"); return; }
  if (draft) { draft = null; selVertex = null; clearDraftLayers(); setHint(null); }
  resetForMap(id);
  selectedId = null; ui.mode = "list";
  if (currentTab !== "map") setTab("map");
  renderZones(); renderPanel();
  setupRealtime();
  await cloudRefresh(true);
  const pts = state.zones.flatMap(z => z.points || []);
  if (pts.length) setTimeout(() => { try { map.invalidateSize(); map.fitBounds(L.latLngBounds(pts).pad(0.2), {maxZoom: 16}); } catch (e) {} }, 80);
  toast(isShared() ? `Carte « ${curMap().name} »` : "Votre carte");
}
function setupRealtime() {
  const c = cloud.client;
  if (cloud.channel) { try { c.removeChannel(cloud.channel); } catch (e) {} cloud.channel = null; }
  if (!isShared() || typeof c.channel !== "function") return;
  let t = null;
  const later = () => { clearTimeout(t); t = setTimeout(() => {
    if (ui.mode === "list" || ui.mode === "detail") cloudRefresh(true).catch(() => {}); else later();
  }, 900); };
  try {
    cloud.channel = c.channel("carte-" + cloud.mapId)
      .on("postgres_changes", {event: "*", schema: "public", table: "zones", filter: "map_id=eq." + cloud.mapId}, later)
      .on("postgres_changes", {event: "*", schema: "public", table: "ratings"}, later)
      .subscribe();
  } catch (e) { console.warn("Heden : temps réel", e); }
}
async function copyToMap(z, mapId, btn) {
  const m = cloud.maps.find(x => x.id === mapId); if (!m) return;
  if (btn) btn.disabled = true;
  try {
    const id = zoneId(), now = new Date().toISOString();
    const row = Object.assign(zoneRow(z), {id, map_id: mapId, created_by: cloud.user.id, updated_at: now});
    let {error} = await cloud.client.from("zones").upsert(row); if (error) throw error;
    ({error} = await cloud.client.from("ratings").upsert(Object.assign(ratingRow(z), {zone_id: id, updated_at: now}))); if (error) throw error;
    toast(`Zone copiée sur « ${m.name} »`);
  } catch (err) { console.warn(err); toast("Copie impossible pour le moment. Réessayez plus tard."); }
  if (btn) btn.disabled = false;
}
const inviteLink = code => location.origin + location.pathname + "?rejoindre=" + encodeURIComponent(code);
async function createSharedMap(name) {
  const {data, error} = await cloud.client.rpc("create_shared_map", {map_name: name || "Notre carte"});
  if (error) throw error;
  const row = Array.isArray(data) ? data[0] : data;
  await loadMaps();
  cloud.invite = {mapId: row.map_id, code: row.code};
  return row;
}
async function newInvite(mapId) {
  const {data, error} = await cloud.client.rpc("new_invite", {m: mapId});
  if (error) throw error;
  cloud.invite = {mapId, code: data};
}
async function joinWithCode(code) {
  code = String(code || "").trim().toUpperCase();
  if (!code) return;
  const {data, error} = await cloud.client.rpc("join_map", {invite_code: code});
  if (error) { toast(/invalide|expir/i.test(error.message || "") ? "Ce code est invalide ou a expiré : demandez-en un nouveau" : "Impossible de rejoindre la carte pour le moment"); return false; }
  await loadMaps();
  const m = cloud.maps.find(x => x.id === data);
  await switchMap(data);
  toast(`Vous avez rejoint « ${m ? m.name : "la carte"} »`);
  return true;
}
async function leaveSharedMap(mapId) {
  if (cloud.mapId === mapId) await switchMap(cloud.personalMapId);
  const {error} = await cloud.client.rpc("leave_map", {m: mapId});
  if (error) { toast("Impossible de quitter la carte pour le moment"); return; }
  await loadMaps();
  if (cloud.invite && cloud.invite.mapId === mapId) cloud.invite = null;
  toast("Vous avez quitté la carte");
  rerenderAll();
}
async function deleteSharedMap(mapId) {
  if (cloud.mapId === mapId) await switchMap(cloud.personalMapId);
  const {error} = await cloud.client.from("maps").delete().eq("id", mapId);
  if (error) { toast("Impossible de supprimer la carte pour le moment"); return; }
  await loadMaps();
  if (cloud.invite && cloud.invite.mapId === mapId) cloud.invite = null;
  toast("Carte supprimée, avec ses zones et ses notes");
  rerenderAll();
}
function inviteHTML(inv) {
  return `<div class="invite">
    <span class="label">Invitation, valable 14 jours</span>
    <div class="invite__code num">${esc(inv.code)}</div>
    <p class="hint2">Envoyez ce lien à votre binôme. Il se connecte avec son e-mail et arrive directement sur la carte.</p>
    <div class="datarow"><button class="btn btn--sm btn--primary" type="button" data-act="share">${navigator.share ? "Envoyer le lien" : "Copier le lien"}</button>${navigator.share ? `<button class="btn btn--sm" type="button" data-act="copy">Copier le lien</button>` : ""}</div>
  </div>`;
}
function sharedHTML() {
  if (!cloudReady) return "";
  let pending = null;
  try { pending = localStorage.getItem("heden.invite"); } catch (e) {}
  if (!cloud.user) return `<section class="sec">
      <h2>Carte à deux</h2>
      <p class="hint2">${pending ? `<b>Vous avez reçu une invitation.</b> Connectez-vous ci-dessus avec votre e-mail : vous rejoindrez la carte automatiquement.` : "Connectez-vous pour créer une carte commune avec votre binôme. Chacun y note les zones avec son propre profil, et la couleur montre votre note commune."}</p>
    </section>`;
  const shared = cloud.maps.filter(m => m.kind === "partagee");
  return `<section class="sec" id="duoSec">
    <h2>Carte à deux</h2>
    <p class="hint2">Une carte commune, en plus de la vôtre : vous y tracez les zones à deux, chacun les note avec son profil, et la couleur montre votre note commune.</p>
    ${shared.map(m => `<div class="mapcard" data-m="${m.id}">
      <div><b>${esc(m.name)}</b><p class="hint2">${esc(membersLabel(m))}</p></div>
      ${cloud.invite && cloud.invite.mapId === m.id ? inviteHTML(cloud.invite) : ""}
      <div class="datarow">
        <button class="btn btn--sm" type="button" data-act="open" ${cloud.mapId === m.id ? "disabled" : ""}>${cloud.mapId === m.id ? "Carte affichée" : "Ouvrir la carte"}</button>
        <button class="btn btn--sm" type="button" data-act="invite">Inviter</button>
        <button class="btn btn--sm btn--ghost btn--danger" type="button" data-act="leave">Quitter</button>
        ${m.owner === cloud.user.id ? `<button class="btn btn--sm btn--danger" type="button" data-act="delete">Supprimer la carte</button>` : ""}
      </div>
      <p class="hint2">${m.owner === cloud.user.id
        ? "Quitter vous retire de la carte, qui reste à votre binôme. Supprimer l’efface pour vous deux, avec ses zones et ses notes. Votre carte perso n’est jamais touchée."
        : "Quitter vous retire de la carte : elle reste à votre binôme, avec vos notes. Votre carte perso n’est jamais touchée."}</p>
    </div>`).join("")}
    <form class="inline-form" id="newMapForm">
      <div class="field"><label class="label" for="newMapName">${shared.length ? "Créer une autre carte commune" : "Créer une carte commune"}</label>
        <input type="text" id="newMapName" placeholder="Ex. Notre recherche" maxlength="40"></div>
      <button class="btn ${shared.length ? "" : "btn--primary"}" type="submit">Créer</button>
    </form>
    <form class="inline-form" id="joinForm">
      <div class="field"><label class="label" for="joinCode">Rejoindre avec un code</label>
        <input type="text" id="joinCode" placeholder="Ex. 7F3A9C21" maxlength="12" autocapitalize="characters" autocomplete="off"></div>
      <button class="btn" type="submit">Rejoindre</button>
    </form>
  </section>`;
}
function bindShared() {
  const sec = $("#duoSec"); if (!sec) return;
  $("#newMapForm").onsubmit = async e => {
    e.preventDefault();
    const b = e.target.querySelector("button"); b.disabled = true;
    try { await createSharedMap($("#newMapName").value.trim()); toast("Carte créée : envoyez l’invitation à votre binôme"); }
    catch (err) { console.warn(err); toast("Création impossible pour le moment"); }
    renderProfile();
  };
  $("#joinForm").onsubmit = async e => {
    e.preventDefault();
    const code = $("#joinCode").value; if (!code.trim()) return;
    const b = e.target.querySelector("button"); b.disabled = true;
    const ok = await joinWithCode(code);
    if (!ok) { b.disabled = false; }
  };
  $$(".mapcard", sec).forEach(card => {
    const id = card.dataset.m;
    card.onclick = async e => {
      const b = e.target.closest("[data-act]"); if (!b) return;
      const act = b.dataset.act;
      if (act === "open") switchMap(id);
      else if (act === "invite") { b.disabled = true; try { await newInvite(id); } catch (err) { toast("Invitation impossible pour le moment"); } renderProfile(); }
      else if (act === "share" || act === "copy") {
        const link = inviteLink(cloud.invite.code);
        if (act === "share" && navigator.share) { try { await navigator.share({title: "Heden", text: "Rejoignez ma carte sur Heden pour noter les quartiers ensemble.", url: link}); } catch (err) {} return; }
        try { await navigator.clipboard.writeText(link); toast("Lien copié"); } catch (err) { window.prompt("Copiez ce lien :", link); }
      } else if (act === "leave" || act === "delete") {
        const label = b.textContent;
        if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = act === "leave" ? "Confirmer : quitter" : "Confirmer : tout supprimer"; setTimeout(() => { if (b.isConnected) { b.classList.remove("armed"); b.textContent = label; } }, 3500); return; }
        if (act === "leave") leaveSharedMap(id); else deleteSharedMap(id);
      }
    };
  });
}

async function cloudRefresh(force) {
  if (!cloud.user || !cloud.mapId) return;
  if (!force && (Date.now() - (cloud.lastRefresh || 0) < 45000)) return;
  if (hasPending()) { await syncNow(); if (hasPending()) return; }
  const c = cloud.client, me = cloud.user.id;
  const [{data: prof, error: e1}, {data: rows, error: e2}] = await Promise.all([
    c.from("profiles").select("*").eq("id", me).maybeSingle(),
    c.from("zones").select("*, ratings(*)").eq("map_id", cloud.mapId)
  ]);
  if (e1 || e2) { setCloudStatus("error", e1 || e2); return; }
  const ids = new Set();
  (rows || []).forEach(r => { ids.add(r.created_by); (r.ratings || []).forEach(x => ids.add(x.user_id)); });
  (curMap() ? curMap().members : []).forEach(m => ids.add(m.userId));
  ids.delete(me);
  if (ids.size) await loadPeople([...ids]);
  let pushProfile = false;
  if (prof && Array.isArray(prof.criteria) && prof.criteria.length) {
    state.profile = {name: prof.display_name || "", presetId: prof.preset_id || null, modified: !!prof.modified, budget: prof.budget == null ? null : Number(prof.budget), criteria: prof.criteria, halfPoints: !!prof.half_points};
  } else pushProfile = true;   // compte neuf : on garde le profil de l'appareil
  const examples = cloud.mapId === cloud.personalMapId ? state.zones.filter(z => z.example) : [];
  state.zones = (rows || []).map(zoneFromRow).concat(examples);
  cloud.synced = snapshot();
  if (pushProfile) cloud.synced.profile = null;
  cloud.lastRefresh = Date.now(); cloud.lastSync = new Date();
  save();
  setCloudStatus("ok");
  rerenderAll();
}

function rerenderAll() {
  if (typeof renderZones !== "function") return;
  renderZones();
  if (currentTab === "map") { if (ui.mode === "list" || ui.mode === "detail") renderPanel(); }
  else renderProfile();
  refreshEstimates();
}

async function sendLoginEmail(email) {
  const {error} = await cloud.client.auth.signInWithOtp({email, options: {emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true}});
  if (error) throw error;
}
async function verifyLoginCode(email, code) {
  const {error} = await cloud.client.auth.verifyOtp({email, token: code.replace(/\s/g, ""), type: "email"});
  if (error) throw error;
}
async function signOut() {
  if (hasPending()) await syncNow();
  try { await cloud.client.auth.signOut(); } catch (e) {}
}

function cloudInit() {
  if (!cloudReady) return;
  cloud.client = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {
    auth: {flowType: "implicit", persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}
  });
  cloud.client.auth.onAuthStateChange((event, session) => {
    const u = session && session.user ? session.user : null;
    if (u && (!cloud.user || cloud.user.id !== u.id)) {
      cloud.user = u; cloud.step = "email"; cloud.synced = null; cloud.names = {};
      renderAccountChip();
      if (event === "SIGNED_IN") toast("Vous êtes connecté : " + (u.email || ""));
      try { if (/(access_token|error)=/.test(location.hash)) history.replaceState(null, "", currentTab === "profile" ? "#profil" : "#carte"); } catch (e) {}
      setTimeout(cloudLoad, 0);
    } else if (!u && cloud.user) {
      if (cloud.channel) { try { cloud.client.removeChannel(cloud.channel); } catch (e) {} }
      Object.assign(cloud, {user: null, mapId: null, personalMapId: null, maps: [], people: {}, channel: null, invite: null, synced: null});
      setCloudStatus("local"); renderAccountChip();
      state = load() || defaultState(); state.zones.forEach(finishZoneGeometry);
      selectedId = null; ui.mode = "list";
      rerenderAll(); renderPanel();
      toast("Déconnecté");
    } else if (u) cloud.user = u;
  });
  window.addEventListener("online", () => scheduleSync(300));
  /* lien d'invitation : ?rejoindre=CODE */
  try {
    const sp = new URLSearchParams(location.search), inv = sp.get("rejoindre");
    if (inv) {
      localStorage.setItem("heden.invite", inv.trim().toUpperCase());
      history.replaceState(null, "", location.pathname + location.hash);
      setTimeout(() => { if (!cloud.user) { setTab("profile"); toast("Connectez-vous pour rejoindre la carte de votre binôme"); } }, 1200);
    }
  } catch (e) {}
  const hp = new URLSearchParams(location.hash.slice(1));
  if (hp.get("error_description") || hp.get("error_code")) {
    const code = hp.get("error_code") || "";
    setTab("profile");
    toast(/expired/.test(code) ? "Ce lien a expiré ou a déjà servi : demandez-en un nouveau" : "Connexion impossible avec ce lien : demandez-en un nouveau");
    try { history.replaceState(null, "", "#profil"); } catch (e) {}
  }
  const ab = document.getElementById("acct"); if (ab) ab.onclick = () => setTab("profile");
  renderAccountChip();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && cloud.user) cloudRefresh(false).catch(() => {}); });
}

/* Démarrage */
renderZones();
setTab(/profil/.test(location.hash) ? "profile" : "map");
cloudInit();
refreshEstimates();
window.__heden = {state: () => state, scoreOf, colorFor, cloud: () => cloud, save, startNew, addPoint, estimate};
})();
</script>
