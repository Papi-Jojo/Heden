<script>try{var sp=document.getElementById("splash");if(sessionStorage.getItem("heden.intro")||matchMedia("(prefers-reduced-motion: reduce)").matches)sp.remove();else{sessionStorage.setItem("heden.intro","1");setTimeout(function(){sp.classList.add("out");setTimeout(function(){sp.remove()},480)},1150)}}catch(e){var s2=document.getElementById("splash");s2&&s2.remove()}</script>
<div id="app">
  <header class="topbar">
    <button class="brand" id="brandHome" type="button" aria-label="Heden, retour à la carte" title="Retour à la carte">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path class="lg" d="M32 5c4 0 7.5 1.6 18 7.7 9.6 5.6 10.8 8.4 10.8 19.3s-1.2 13.7-10.8 19.3C39.5 57.4 36 59 32 59s-7.5-1.6-18-7.7C4.4 45.7 3.2 42.9 3.2 32s1.2-13.7 10.8-19.3C24.5 6.6 28 5 32 5z" style="fill:var(--ardoise)"/><path class="lg" d="M17.5 22.8c1.8-4.6 7.9-6.5 12-4.6 3.7 1.7 4.5 6.5 2.2 9.9-2.6 3.9-8.1 5.2-11.8 3.4-2.8-1.4-3.5-5.1-2.4-8.7z" style="fill:var(--pierre)"/><path class="lg" d="M37.4 16.9c3.6-1.6 9 .4 10.4 4.3 1.2 3.4-1.4 6.6-5.1 7.2-3.9.6-7.6-1.4-8.3-4.6-.6-2.8.4-5.6 3-6.9z" style="fill:var(--pierre)"/><path class="lg" d="M16.8 39.6c.9-3.6 5.4-5.7 9-4.3 3.9 1.5 5.3 6.4 3.3 9.8-1.8 3.1-6.2 4-9.3 2.2-2.6-1.5-3.7-4.6-3-7.7z" style="fill:var(--pierre)"/><path class="lg" d="M35.2 36.4c2.9-4.2 9.7-5.3 13.4-2 3.3 3 2.6 8.7-1.3 11.6-4 3-10 2.9-12.6-.4-2-2.5-1.5-6.4.5-9.2z" style="fill:var(--bourgeon)"/></svg>
      <b>heden</b>
    </button>
    <button class="acct" id="acct" type="button" hidden></button>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="map" aria-selected="true">Carte</button>
      <button class="tab" role="tab" data-tab="annonces" aria-selected="false">Annonces</button>
      <button class="tab" role="tab" data-tab="favoris" aria-selected="false">Favoris</button>
      <button class="tab" role="tab" data-tab="profile" aria-selected="false">Profil</button>
    </nav>
  </header>

  <main>
    <section class="view" id="view-map">
      <aside class="panel" id="panel" data-mode="list" role="region" aria-label="Panneau des zones"></aside>
      <div id="map">
        <div class="map-top">
          <form class="search" id="search" autocomplete="off">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="q" type="search" placeholder="Adresse, rue, station…" aria-label="Rechercher une adresse">
            <div class="results" id="results" hidden></div>
          </form>
          <div class="seg" id="basemap" role="group" aria-label="Fond de carte">
            <button type="button" data-base="plan" aria-pressed="true">Plan</button>
            <button type="button" data-base="sat" aria-pressed="false">Satellite</button>
          </div>
        </div>
        <div class="walkbar" id="walkbar" hidden></div>
        <div class="mapmode" id="mapMode" role="group" aria-label="Projet affiché sur la carte" hidden><button type="button" data-proj="achat" aria-pressed="true">Achat</button><button type="button" data-proj="location" aria-pressed="false">Location</button></div>
        <div class="fab-col">
          <div class="mapf" id="mapf">
            <button class="icon-btn mapf__btn" id="mapfBtn" type="button" aria-expanded="false" aria-controls="mapfList" title="Filtres" aria-label="Filtres de la carte">
              <svg class="mapf__ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
              <svg class="mapf__x" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
              <i class="mapf__dot" aria-hidden="true"></i>
            </button>
            <div class="mapf__list" id="mapfList" role="group" aria-label="Afficher sur la carte">
              <button class="mapf__opt" type="button" data-mf="zones" aria-pressed="true" style="--i:0"><svg class="mapf__eye" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/><path class="mapf__slash" d="M4 4l16 16"/></svg><span>Zones</span></button>
              <button class="mapf__opt" type="button" data-mf="annonces" aria-pressed="true" style="--i:1"><svg class="mapf__eye" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/><path class="mapf__slash" d="M4 4l16 16"/></svg><span>Annonces</span></button>
            </div>
          </div>
          <button class="icon-btn" id="walkBtn" type="button" title="Tracer une balade" aria-label="Tracer une balade">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg>
          </button>
          <button class="icon-btn" id="locate" type="button" title="Ma position" aria-label="Ma position">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          </button>
        </div>
        <div class="hint" id="hint" hidden></div>
      </div>
    </section>

    <section class="view" id="view-annonces" hidden>
      <div class="ann" id="annonces"></div>
    </section>
    <section class="view" id="view-profile" hidden>
      <div class="prof" id="prof"></div>
    </section>
  </main>

  <nav class="tabbar" role="tablist">
    <button role="tab" data-tab="map" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>Carte
    </button>
    <button role="tab" data-tab="annonces" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M4 11 12 4l8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg>Annonces
    </button>
    <button role="tab" data-tab="favoris" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>Favoris
    </button>
    <button role="tab" data-tab="profile" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profil
    </button>
  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
